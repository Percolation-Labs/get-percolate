# @claude in an issue or a review comment, and Claude Code picks it up.
#
# Same shape as p8k8's, with one addition: an author check. THIS REPOSITORY IS PUBLIC, so
# without it any GitHub user could spend the owner's Claude subscription by
# typing four characters in a comment.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Two conditions, and both matter. The mention is what makes it opt-in --
    # without it every comment on every issue starts a run. The author check is
    # what stops a stranger doing the same: `@claude` is a string anybody can
    # type, and a run started by a drive-by comment spends the repository
    # owner's OAuth token with the repository owner's write permissions.
    #
    # author_association is GitHub's own answer to "who is this to this repo":
    # OWNER, MEMBER and COLLABORATOR are people who already have push access.
    # CONTRIBUTOR (merged a PR once) and NONE are deliberately not on the list.
    if: |
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
       (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read          # so Claude can read CI results on a PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
