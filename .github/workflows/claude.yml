# @claude in an issue or a review comment, and Claude Code picks it up.
#
# THIS COPY DIFFERS FROM THE PRIVATE ONES (percolate-application, p8-subsystems)
# in one way: it gets no cross-repository token (REM-1045). This repository is
# PUBLIC, so the text an agent reads here can be a stranger's even when the
# mention is a collaborator's: an @claude reply on an outside issue puts that
# issue's body in front of the run. A run here holds this repository's own
# GITHUB_TOKEN and nothing else, and cannot dispatch workflows. A release that
# crosses repositories is asked for from a private repository instead.
#
# THE AUTHOR CHECK IS STILL NEEDED: without it any GitHub user could spend the
# owner's Claude subscription by typing four characters in a comment.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Two conditions, and both matter. The mention is what makes it opt-in --
    # without it every comment on every issue starts a run. The author check is
    # what stops a stranger doing the same: `@claude` is a string anybody can
    # type, and a run started by a drive-by comment spends the repository
    # owner's OAuth token with the repository owner's write permissions.
    #
    # author_association is GitHub's own answer to "who is this to this repo":
    # OWNER, MEMBER and COLLABORATOR are people who already have push access.
    # CONTRIBUTOR (merged a PR once) and NONE are deliberately not on the list.
    if: |
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
       (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read          # read CI; dispatching workflows is for the private repos
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # This repository's token only: no secret that reaches another
          # repository is ever in scope here (REM-1045, see the header).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # REQUIRED, and the one thing here that is not in this file. Mint it
          # with `claude setup-token` and set it on all three repositories:
          #     gh secret set CLAUDE_CODE_OAUTH_TOKEN -R <owner>/<repo>
          # Unset, the action does not report anything useful on the issue --
          # it comments "Claude encountered an error" and exits 1 in about
          # thirty seconds, having read nothing. So a mention that goes quiet
          # is this before it is anything else; `gh secret list` is the check.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # The action's Bash gate is deny-by-default and `gh` is not on the
          # default list, so without this the GH_TOKEN above is inert. A wiring
          # test got "This command requires approval" for every gh call,
          # `gh --version` included: the binary never ran, so nothing ever
          # reached the API to test the token against.
          #
          # `git` is named even though it already worked, because it is not
          # obvious whether declaring an allowlist extends the default one or
          # replaces it. Naming it costs nothing and settles the question.
          claude_args: |
            --allowedTools "Bash(gh:*),Bash(git:*)"
