# Install this repository the way a stranger does, by running its own pages.
#
# Everything the documentation got wrong was mechanical, and all of it survived
# review: a grant list whose verbs no policy asked for, a CLI no page said to
# install, a sample path that assumed a clone nobody was told to make, and an
# evidence block showing an HTTP code the server had stopped returning. Prose
# is reviewed by reading; commands are only reviewed by running.
#
# Against the PUBLISHED image, deliberately. A locally built one is how a stale
# parser stayed invisible for a day -- the artifact a reader gets is the only
# artifact whose cold start is worth asserting.
name: coldstart

on:
  # Only when something this actually exercises moves. It brings up the whole
  # compose stack, pulls four images and pip-installs a CLI, so running it for a
  # typo in an unrelated README is a minute of everybody's time for no signal.
  #
  # The daily schedule below is what makes the narrow list safe: anything that
  # breaks a reader WITHOUT a commit here -- a new percolate-core release, a
  # moved image tag, a changed raw.githubusercontent path -- is caught within a
  # day regardless of what these paths say.
  push:
    branches: [main]
    # Repeated rather than shared with a YAML anchor: GitHub Actions does not
    # support anchors or aliases in workflow files, and an unsupported one is a
    # parse error at the moment you need the workflow.
    paths:
      - 'docs/src/**'
      - 'compose/**'
      - 'install.sh'
      - 'bootstrap.sql'
      - 'ci/**'
      - 'versions.toml'
      - '.github/workflows/coldstart.yml'
  pull_request:
    paths:
      - 'docs/src/**'
      - 'compose/**'
      - 'install.sh'
      - 'bootstrap.sql'
      - 'ci/**'
      - 'versions.toml'
      - '.github/workflows/coldstart.yml'

  # A reader's experience can break without anybody touching this repository:
  # a new percolate-core release, a moved image tag, a raw.githubusercontent
  # path. None of those arrive as a commit here.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  cold-start:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the install guide
        run: ci/coldstart.sh

      - name: What the stack said, if it failed
        if: failure()
        run: docker compose -p percolate logs --tail=80 || true
