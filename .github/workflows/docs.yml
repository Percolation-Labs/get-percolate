# Build the docs and the Helm chart repository, publish both to GitHub Pages.
#
# One site, two things on it: the pages at the root and the chart index under
# /charts. That is why `helm repo add percolate https://percolation-labs.github.io/get-percolate/charts`
# works without a second host or a second DNS record to keep alive.
name: docs

on:
  push:
    branches: [main]
    # README.md is here because this job runs `ci/versions.py --check`, and one
    # of the literals that check verifies -- the documented pip floor -- lives
    # in the README. Scoping the job without it would have left the only gate on
    # that literal unreachable by the edit that breaks it.
    paths: ["docs/**", "charts/**", "README.md", "versions.toml", "ci/versions.py",
            ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write        # to push the chart to GHCR

# A queued run must not overtake the one publishing. Not cancel-in-progress:
# cancelling a half-finished deploy leaves the live site mid-swap.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}   # tomllib is stdlib from 3.11

      # Before building, because a site built from a stale number is a site that
      # has to be rebuilt. This is the check that replaced a GitHub issue asking
      # a person to go and find every version quoted in prose -- which did not
      # work: three pages said the dialect was 0.1.0 for a whole release after
      # it became 0.1.1, and nothing reported it.
      - name: versions.toml agrees with every file that repeats it
        run: python3 ci/versions.py --check

      - name: Build the site
        run: |
          pip install "markdown==3.7" "pygments==2.19.1" "pyyaml==6.0.2"
          python docs/build.py

      - uses: azure/setup-helm@v5
        with: {version: v3.16.3}

      - name: Lint and package the chart
        run: |
          helm lint charts/percolate \
            --set secrets.postgresPassword=x \
            --set secrets.authenticatorPassword=y \
            --set secrets.workerPassword=z \
            --set secrets.jwtSecret=abcdefghijklmnopqrstuvwxyz012345
          mkdir -p docs/_site/charts
          helm package charts/percolate -d docs/_site/charts
          # EARLIER VERSIONS ARE RE-FETCHED, NOT MERGED. This used `--merge
          # old-index.yaml` so a pinned version stayed in the index -- but every
          # Pages deploy replaces the whole site, so the index kept listing
          # 0.1.0-0.1.3 while their .tgz files had gone: `helm pull --version
          # 0.1.3` from the classic repo answered 404. The OCI registry keeps
          # every version pushed to it, so each earlier version is pulled back
          # from there into this directory, and the index is built from the
          # files actually present -- an entry cannot outlive its tarball.
          # Versions the registry never had (0.1.0-0.1.2, from before it was
          # the primary) drop out rather than pointing at a 404.
          OWNER=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if curl -fsSL https://percolation-labs.github.io/get-percolate/charts/index.yaml -o old-index.yaml; then
            for v in $(sed -n 's/^    version: //p' old-index.yaml | sort -u); do
              [ -f "docs/_site/charts/percolate-$v.tgz" ] && continue
              helm pull "oci://ghcr.io/$OWNER/charts/percolate" --version "$v" \
                -d docs/_site/charts 2>/dev/null \
                || echo "chart $v is not in the registry; leaving it out of the index"
            done
          fi
          helm repo index docs/_site/charts --url https://percolation-labs.github.io/get-percolate/charts
          ls docs/_site/charts

      - name: Check the chart renders
        # `helm lint` accepts templates that produce invalid Kubernetes objects.
        # Rendering and parsing every document is the cheap check that catches
        # a bad indent or a nil deref before it is a broken install.
        run: |
          helm template p charts/percolate \
            --set secrets.postgresPassword=x \
            --set secrets.authenticatorPassword=y \
            --set secrets.workerPassword=z \
            --set secrets.jwtSecret=abcdefghijklmnopqrstuvwxyz012345 \
            | python3 -c "import sys,yaml; print(len([d for d in yaml.safe_load_all(sys.stdin) if d]), 'objects parse')"

      - name: Publish the chart to GHCR as an OCI artifact
        # THE PRIMARY DISTRIBUTION. An OCI registry needs no index.yaml, no
        # Pages build and -- the reason it is primary rather than an extra --
        # NO DNS. A classic Helm repo is a URL, so it inherits every failure of
        # the domain in front of it; a chart nobody can install because a CNAME
        # is missing is a worse outcome than one extra command to learn.
        # Helm >= 3.8, Flux OCIRepository and Argo all consume this directly.
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u ${{ github.actor }} --password-stdin
          # Lowercased: an OCI namespace must be, and the owner is now
          # `Percolation-Labs`. Under the old owner the raw value happened to
          # already be lowercase, so this push worked by luck rather than rule.
          OWNER=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # The version just packaged, by name: the directory also holds the
          # earlier versions re-fetched for the classic index, and a glob
          # handed `helm push` all of them -- it read the second as the remote.
          V=$(sed -n 's/^version: //p' charts/percolate/Chart.yaml)
          helm push "docs/_site/charts/percolate-$V.tgz" "oci://ghcr.io/$OWNER/charts"

      - uses: actions/upload-pages-artifact@v5
        with: {path: docs/_site}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
