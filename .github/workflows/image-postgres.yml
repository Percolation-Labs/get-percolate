# percolationlabs/percolate-postgres, built once and called from two places.
#
# TWO PATHS THROUGH THIS JOB, and conflating them is what made a release feel
# like a punishment. Measured on the run that prompted the split: 502 seconds
# total, of which 446 were `docker build` recompiling pgvector and pg_cron from
# source for both architectures -- arm64 under QEMU emulation on an amd64
# runner -- and 32 more were the CPU-portability gate pulling both images back
# down and disassembling them.
#
# Almost none of that work was needed. The overwhelmingly common release
# changes ONE FILE in this image: the generated extension SQL. The compiled
# artifacts are identical, and they are COPY'd near the end of the Dockerfile
# on purpose, so the layer ordering was already right and only the cache was
# missing.
#
#   FAST  (verify_binaries: false)  the extension SQL changed and nothing else.
#         Three COPY layers over a warm cache; the binary gate is skipped
#         because the binaries are the ones it already passed. This is most
#         releases. It refuses to run if dev/Dockerfile.pg19 actually changed,
#         so the fast path cannot silently become the wrong one.
#
#   FULL  (verify_binaries: true)   something COMPILED changed: the Dockerfile,
#         the pgvector or pg_cron version, the base image, or the parser
#         release. Everything recompiles and the portability gate runs, because
#         that gate is a statement about compiled binaries and nothing else.
#
# The inner development loop is neither of these and does not build an image at
# all: regenerate the SQL and load it into a running database
# (`extension/percolate/build-sql.py`, then psql). Seconds. An image is what
# other people pull, not what you iterate against -- p8-subsystems PACKAGING.md
# has that end of it.
#
# Reusable rather than copied, because it has two callers with the same job:
# the extension release (parser.yml, right after the release assets exist) and
# a manual rebuild (images.yml, when the image needs to move and the extension
# does not). Two copies of a multi-arch image build is exactly the "which tag
# is current" mistake PACKAGING.md argues one image over three to avoid --
# applied to the workflow instead of the image.
name: image-postgres

on:
  workflow_call:
    inputs:
      ref:
        description: p8-subsystems ref to build the extension SQL from
        type: string
        default: main
      version:
        description: extension version, for the immutable :19-<version> tag
        type: string
        required: true
      parser_release:
        description: get-percolate release tag to take the .so files from
        type: string
        default: latest
      push:
        type: boolean
        default: false
      # WHICH PATH THIS RUN IS, and the two are not the same job (see the
      # header). `false` is the fast path: the compiled artifacts are
      # unchanged, so the build is three COPY layers over a cache and the
      # binary gate has nothing new to inspect. It is REFUSED below if the
      # Dockerfile has in fact changed, so choosing it wrongly fails loudly
      # rather than skipping a check that was needed.
      verify_binaries:
        description: >-
          full path -- recompile and re-run the CPU-portability gate. Needed
          only when something COMPILED changed: the Dockerfile, pgvector,
          pg_cron, the base image, or the parser release.
        type: boolean
        default: true
    secrets:
      SOURCE_TOKEN:      {required: true}
      DOCKERHUB_USERNAME: {required: false}
      DOCKERHUB_TOKEN:    {required: false}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SPECS_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          ref: ${{ inputs.ref }}

      - name: Fetch the parser for both Linux architectures
        # From the release, rather than rebuilt here: the .so in the image and
        # the .so someone installs with install.sh must be the same artifact,
        # or "works in Docker, fails on my Postgres" becomes a class of bug
        # with no way to tell the two builds apart.
        env:
          BASE: >-
            ${{ inputs.parser_release == 'latest'
                && 'https://github.com/percolating-sirsh/get-percolate/releases/latest/download'
                || format('https://github.com/percolating-sirsh/get-percolate/releases/download/{0}', inputs.parser_release) }}
        run: |
          mkdir -p dev/dist
          for a in amd64 arm64; do
            curl -fsSL -o "dev/dist/percolate_parser-$a.so" "$BASE/percolate_parser-linux-$a.so"
          done
          curl -fsSL -o dev/dist/percolate_parser.control "$BASE/percolate_parser.control"
          # Named by the version rather than hardcoded: the release asset is
          # percolate_parser--<version>.sql, and pinning 0.1.0 here is what
          # made the old install path a silent 404 after the first bump.
          curl -fsSL -o "dev/dist/percolate_parser--${{ inputs.version }}.sql" \
            "$BASE/percolate_parser--${{ inputs.version }}.sql"

      - name: Generate the extension SQL
        run: |
          python3 extension/percolate/build-sql.py
          cp "extension/percolate/sql/percolate--${{ inputs.version }}.sql" dev/dist/
          cp extension/percolate/percolate.control dev/dist/

      - name: Confirm the tree is at the version being tagged
        # The image is about to be tagged :19-<version>. If the checked-out ref
        # carries a different default_version, that tag is a lie -- and it is
        # the tag someone pins to.
        run: |
          have=$(sed -n "s/^default_version = '\(.*\)'/\1/p" extension/percolate/percolate.control)
          [ "$have" = "${{ inputs.version }}" ] || {
            echo "::error::ref ${{ inputs.ref }} is extension $have, not ${{ inputs.version }}" >&2
            exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.push
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # BEFORE THE BUILD, not after it. Put after, this check cost nine
      # minutes to tell you the run was never going to be allowed -- the same
      # ordering mistake as pushing a tag before the gate that inspects it, one
      # step along. Nothing here needs the image: the precondition is a
      # property of this tree and of what is already published.
      #
      # The fast path is only legitimate while the compiled half is identical
      # to a build that already passed the gate. That is checkable rather than
      # a matter of discipline: the previous image carries the hash of the
      # Dockerfile it was built from, and if this tree's differs then something
      # compiled DID change and the full path is the one that was needed.
      - name: Refuse the fast path when the compiled half changed
        if: inputs.push && !inputs.verify_binaries
        run: |
          prev=$(docker buildx imagetools inspect \
                   percolationlabs/percolate-postgres:19 --format \
                   '{{ index .Image.Config.Labels "org.percolate.dockerfile-sha" }}' \
                 2>/dev/null || true)
          now='${{ hashFiles('dev/Dockerfile.pg19') }}'
          echo "published Dockerfile sha: ${prev:-unknown}"
          echo "this tree's:              $now"
          if [ -z "$prev" ]; then
            echo "::error::the published image carries no Dockerfile hash, so the" >&2
            echo "::error::fast path cannot prove the compiled half is unchanged." >&2
            echo "::error::Re-run with verify_binaries: true once, to establish it." >&2
            exit 1
          fi
          [ "$prev" = "$now" ] || {
            echo "::error::dev/Dockerfile.pg19 changed since the published image." >&2
            echo "::error::That is the FULL path -- re-run with verify_binaries: true." >&2
            exit 1; }

      - uses: docker/build-push-action@v6
        with:
          context: dev
          file: dev/Dockerfile.pg19
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          # THE REASON A RELEASE TOOK EIGHT MINUTES. Without a cache an
          # ephemeral runner recompiles pgvector and pg_cron from source for
          # both architectures on every run, with arm64 under QEMU emulation --
          # 446 of the 502 seconds, measured. Those layers change when the
          # Dockerfile does, which is rarely; the extension SQL changes on
          # every spec edit, which is constantly, and it is COPY'd near the end
          # on purpose. So the layer ordering was already right and the cache
          # is what lets it pay off.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Recorded ON the image so the fast path below can check its own
          # precondition instead of trusting whoever ticked the box.
          labels: |
            org.percolate.dockerfile-sha=${{ hashFiles('dev/Dockerfile.pg19') }}
            org.percolate.parser-release=${{ inputs.parser_release }}
          # Two tags, and the second one is the point. `19` is the Postgres
          # major and is mutable -- it is what the compose file and the chart
          # pull, and it moves every release. `19-<version>` never moves, so a
          # deployment can pin a known extension build and an upgrade is a
          # visible edit rather than whatever `19` happens to mean today.
          # Without it there is no way to say which build a cluster is running,
          # which matters more than usual here: pre-1.0 there is no in-place
          # extension upgrade, so pinning IS the upgrade strategy.
          # ONLY THE IMMUTABLE TAG IS PUSHED HERE. `19` is moved at the end of
          # this job, after the checks below have passed, and that ordering is
          # the whole point of having them: pushing both tags up front meant
          # the portability gate ran AFTER the mutable tag every user pulls had
          # already moved to the image it was about to refuse. A gate that
          # opens the door and then inspects the visitor is a report.
          tags: |
            percolationlabs/percolate-postgres:19-${{ inputs.version }}

      - name: Confirm both architectures are in the manifest
        if: inputs.push
        run: |
          for t in 19-${{ inputs.version }}; do
            m=$(docker buildx imagetools inspect "percolationlabs/percolate-postgres:$t")
            echo "$m" | grep -q linux/amd64 || { echo "::error::$t has no amd64" >&2; exit 1; }
            echo "$m" | grep -q linux/arm64 || { echo "::error::$t has no arm64" >&2; exit 1; }
          done

      # THE CHECK THAT WOULD HAVE CAUGHT v0.1.0, and the reason it is a static
      # one. That image killed the backend with `signal 4: Illegal instruction`
      # on the first `<=>`, on every Apple Silicon machine: pgvector's Makefile
      # defaults to -march=native, CI builds arm64 on Neoverse runners which
      # have SVE, and Apple Silicon does not implement SVE.
      #
      # A smoke test that RAN a query here would not have found it. The runner
      # executes the image on the CPU it was just built on, where the
      # instructions are legal -- the defect only appears on a CPU different
      # from the builder's, which is every user's and no runner's. So the
      # observable is not "does a query work" but "does this binary contain
      # instructions outside the architecture baseline", which is answerable
      # from the disassembly without executing anything.
      #
      # Inserting a vector worked on the broken image; only the distance
      # function carried the instructions. That is why this looks at the
      # library rather than at whether the extension loads.
      - name: Refuse a build compiled for the builder's own CPU
        if: inputs.push && inputs.verify_binaries
        run: |
          # SCOPED TO THE FUNCTION THE INSTRUCTION SITS IN, which the first
          # version of this check was not -- and it refused a correct build.
          #
          # pgvector 0.8.x ships EXPLICIT AVX-512 kernels and selects them at
          # runtime: BitHammingDistanceAvx512Popcount and its Jaccard twin are
          # compiled with a target attribute and reached only through a CPU
          # feature test. A portable build therefore CONTAINS zmm instructions
          # by design, and counting them across the whole library cannot tell
          # that apart from -march=native. Measured on the published image:
          # 20 such instructions, all of them inside those two functions, with
          # 108 cpuid/__cpu_model sites gating the dispatch.
          #
          # What -march=native actually looks like is the opposite -- the
          # instructions are everywhere, in the ordinary distance and
          # quantisation loops, not confined to two functions whose names say
          # what they are. So the observable is "does a function that is NOT a
          # dispatched kernel carry non-baseline instructions", which is still
          # answerable from the disassembly and no longer confuses a deliberate
          # runtime-dispatched kernel with an accident of the builder's CPU.
          fail=0
          for a in amd64 arm64; do
            case $a in
              # SVE (Neoverse and later): absent from Apple Silicon.
              arm64) bad='ptrue|whilelt|ld1[bhwd]|st1[bhwd]' ;;
              # AVX-512: absent from most consumer and older server parts.
              amd64) bad='%zmm|kmov[bwdq]|vpternlog' ;;
            esac
            # Functions whose names declare them as explicitly-dispatched
            # kernels. Anything else carrying these instructions is the bug.
            dispatched='Avx512|Avx2|Sve|Neon|Dispatch'
            fns=$(docker run --rm --platform "linux/$a" \
                  "percolationlabs/percolate-postgres:19-${{ inputs.version }}" \
                  sh -c "objdump -d /usr/lib/postgresql/19/lib/vector.so \
                         | awk '/^[0-9a-f]+ </ {fn=\$2} /$bad/ {print fn}' \
                         | sort -u" || true)
            offenders=$(printf '%s\n' "$fns" | grep -vE "$dispatched" | grep . || true)
            echo "$a: functions with non-baseline instructions: ${fns:-none}"
            [ -z "$offenders" ] || {
              echo "::error::vector.so for $a was compiled for the build machine's CPU" >&2
              echo "::error::non-baseline instructions outside a dispatched kernel: $offenders" >&2
              echo "::error::pass OPTFLAGS=\"\" to pgvector's make -- see dev/Dockerfile.pg19" >&2
              fail=1; }
          done
          [ "$fail" = "0" ]

      # The mutable tag moves LAST, and only if everything above passed. This
      # is a manifest copy rather than a rebuild, so `19` and `19-<version>`
      # are the same digests by construction -- there is no window in which
      # they could be two different builds.
      - name: Move the :19 tag onto the verified build
        if: inputs.push
        run: |
          docker buildx imagetools create \
            -t percolationlabs/percolate-postgres:19 \
            percolationlabs/percolate-postgres:19-${{ inputs.version }}
          docker buildx imagetools inspect percolationlabs/percolate-postgres:19 \
            | grep -E 'linux/(amd64|arm64)'
