# percolationlabs/percolate-postgres, built once and called from two places.
#
# TWO PATHS THROUGH THIS JOB, and conflating them is what made a release feel
# like a punishment. Measured on the run that prompted the split: 502 seconds
# total, of which 446 were `docker build` recompiling pgvector and pg_cron from
# source for both architectures -- arm64 under QEMU emulation on an amd64
# runner -- and 32 more were the CPU-portability gate pulling both images back
# down and disassembling them.
#
# Almost none of that work was needed. The overwhelmingly common release
# changes ONE FILE in this image: the generated extension SQL. The compiled
# artifacts are identical, and they are COPY'd near the end of the Dockerfile
# on purpose, so the layer ordering was already right and only the cache was
# missing.
#
#   FAST  (verify_binaries: false)  the extension SQL changed and nothing else.
#         Three COPY layers over a warm cache; the binary gate is skipped
#         because the binaries are the SAME BYTES as the ones it already
#         passed -- which is checked, by comparing the resolved parser release
#         and the .so digests, plus the Dockerfile hash, against what the
#         published image records. This is most releases. It refuses to run
#         when any of the three moved, so the fast path cannot silently
#         become the wrong one.
#
#   FULL  (verify_binaries: true)   something COMPILED changed: the Dockerfile,
#         the pgvector or pg_cron version, the base image, or the parser
#         release. Everything recompiles and the portability gate runs, because
#         that gate is a statement about compiled binaries and nothing else.
#
# The inner development loop is neither of these and does not build an image at
# all: regenerate the SQL and load it into a running database
# (`extension/percolate/build-sql.py`, then psql). Seconds. An image is what
# other people pull, not what you iterate against -- p8-subsystems PACKAGING.md
# has that end of it.
#
# Reusable rather than copied, because it has two callers with the same job:
# the extension release (parser.yml, right after the release assets exist) and
# a manual rebuild (images.yml, when the image needs to move and the extension
# does not). Two copies of a multi-arch image build is exactly the "which tag
# is current" mistake PACKAGING.md argues one image over three to avoid --
# applied to the workflow instead of the image.
name: image-postgres

on:
  workflow_call:
    inputs:
      ref:
        description: p8-subsystems ref to build the extension SQL from
        type: string
        default: main
      version:
        description: extension version, for the immutable :19-<version> tag
        type: string
        required: true
      parser_release:
        description: get-percolate release tag to take the .so files from
        type: string
        default: latest
      push:
        type: boolean
        default: false
      # WHICH PATH THIS RUN IS, and the two are not the same job (see the
      # header). `false` is the fast path: the compiled artifacts are
      # unchanged, so the build is three COPY layers over a cache and the
      # binary gate has nothing new to inspect. It is REFUSED below if the
      # Dockerfile hash, the resolved parser release or the parser .so digests
      # differ from what the published image records, so choosing it wrongly
      # fails loudly rather than skipping a check that was needed.
      verify_binaries:
        description: >-
          full path -- recompile and re-run the CPU-portability gate. Needed
          only when something COMPILED changed: the Dockerfile, pgvector,
          pg_cron, the base image, or the parser release.
        type: boolean
        default: true
    secrets:
      SOURCE_TOKEN:      {required: true}
      DOCKERHUB_USERNAME: {required: false}
      DOCKERHUB_TOKEN:    {required: false}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SPECS_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          ref: ${{ inputs.ref }}

      - name: Fetch the parser for both Linux architectures
        # From the release, rather than rebuilt here: the .so in the image and
        # the .so someone installs with install.sh must be the same artifact,
        # or "works in Docker, fails on my Postgres" becomes a class of bug
        # with no way to tell the two builds apart.
        #
        # THIS STEP IS WHERE THE COMPILED HALF GETS AN IDENTITY, and it had
        # none before. Nothing in this workflow compiles the parser, so no
        # property of this tree describes it -- it is whatever bytes a release
        # is serving at the moment curl runs. The precondition below used to
        # compare the Dockerfile hash and read the answer as "the binaries did
        # not change", which is a different sentence: a new parser release, or
        # the same tag re-pointed, moves every byte of the parser with
        # dev/Dockerfile.pg19 untouched. So the tag is RESOLVED here and the
        # .so files are HASHED here, and those three values -- resolved tag,
        # per-arch digest, combined digest -- are what the image records and
        # what the fast path compares.
        id: parser
        env:
          PARSER_RELEASE: ${{ inputs.parser_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=Percolation-Labs/get-percolate
          # `latest` IS RESOLVED BEFORE ANYTHING COMPARES IT. It is a moving
          # name: recording it on the image and then comparing it against the
          # next run's `latest` compares a string to itself and proves exactly
          # as little as hashing the Dockerfile did. Resolved once, here, and
          # the download URL, the label and the precondition all use the
          # answer -- which also collapses the two URL shapes into one.
          tag=$PARSER_RELEASE
          if [ "$tag" = latest ]; then
            tag=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                    "https://api.github.com/repos/$repo/releases/latest" \
                  | jq -r '.tag_name // empty')
            [ -n "$tag" ] || {
              echo "::error::could not resolve 'latest' to a get-percolate release tag" >&2
              exit 1; }
          fi
          echo "parser release: $PARSER_RELEASE -> $tag"
          BASE="https://github.com/$repo/releases/download/$tag"

          mkdir -p dev/dist
          for a in amd64 arm64; do
            curl -fsSL -o "dev/dist/percolate_parser-$a.so" "$BASE/percolate_parser-linux-$a.so"
          done
          curl -fsSL -o dev/dist/percolate_parser.control "$BASE/percolate_parser.control"
          # Named by the version rather than hardcoded: the release asset is
          # percolate_parser--<version>.sql, and pinning 0.1.0 here is what
          # made the old install path a silent 404 after the first bump.
          curl -fsSL -o "dev/dist/percolate_parser--${{ inputs.version }}.sql" \
            "$BASE/percolate_parser--${{ inputs.version }}.sql"

          # The digests are of the BYTES THAT GO INTO THE IMAGE, taken here
          # rather than read back out of it, because these same files are what
          # the Dockerfile COPYs. The combined digest is what the precondition
          # compares; the per-arch ones are on the image so that a human can
          # check a published image against them without a rebuild:
          #   docker run --rm --platform linux/arm64 <image> \
          #     sha256sum /usr/lib/postgresql/19/lib/percolate_parser.so
          amd=$(sha256sum dev/dist/percolate_parser-amd64.so | cut -c1-64)
          arm=$(sha256sum dev/dist/percolate_parser-arm64.so | cut -c1-64)
          so=$(printf 'amd64:%s\narm64:%s\n' "$amd" "$arm" | sha256sum | cut -c1-64)
          echo "  amd64 .so: $amd"
          echo "  arm64 .so: $arm"
          echo "  combined:  $so"
          { echo "tag=$tag"
            echo "so_sha256=$so"
            echo "amd64_sha256=$amd"
            echo "arm64_sha256=$arm"; } >> "$GITHUB_OUTPUT"

      - name: Generate the extension SQL
        run: |
          python3 extension/percolate/build-sql.py
          cp "extension/percolate/sql/percolate--${{ inputs.version }}.sql" dev/dist/
          cp extension/percolate/percolate.control dev/dist/
          # The upgrade scripts, or ALTER EXTENSION percolate UPDATE has nothing
          # to run and every existing database is stranded at the version that
          # installed it. The glob catches the double-dash form that
          # "percolate--<version>.sql" alone does not.
          for up in extension/percolate/sql/percolate--*--"${{ inputs.version }}".sql; do
            [ -e "$up" ] && cp "$up" dev/dist/ && echo "ships: $(basename "$up")"
          done

      # WHAT THIS IMAGE WAS BUILT FROM, and the Dockerfile requires it -- a
      # published image with no provenance is the case percolate_build() exists
      # to prevent. dev/build-image.sh writes this for a local build; nothing
      # wrote it here, so the first release after that Dockerfile change failed
      # on `"/dist/percolate-build.sql": not found` AFTER publishing the release
      # assets. The tag was not created, which is why the retry is clean.
      - name: Stamp what this image was built from
        run: |
          SHA=$(git rev-parse --short HEAD)
          printf -- '-- GENERATED by image-postgres.yml.\n' > dev/dist/percolate-build.sql
          for c in schema parser; do
            printf "select public.percolate_record_build('%s', '%s', '%s', '%s');\n" \
              "$c" "${{ inputs.version }}" "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              >> dev/dist/percolate-build.sql
          done
          cat dev/dist/percolate-build.sql

      - name: Confirm the tree is at the version being tagged
        # The image is about to be tagged :19-<version>. If the checked-out ref
        # carries a different default_version, that tag is a lie -- and it is
        # the tag someone pins to.
        run: |
          have=$(sed -n "s/^default_version = '\(.*\)'/\1/p" extension/percolate/percolate.control)
          [ "$have" = "${{ inputs.version }}" ] || {
            echo "::error::ref ${{ inputs.ref }} is extension $have, not ${{ inputs.version }}" >&2
            exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.push
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # BEFORE THE BUILD, not after it. Put after, this check cost nine
      # minutes to tell you the run was never going to be allowed -- the same
      # ordering mistake as pushing a tag before the gate that inspects it, one
      # step along. Nothing here needs the image: the precondition is a
      # property of this tree and of what is already published.
      #
      # The fast path is only legitimate while the compiled half is identical
      # to a build that already passed the gate, and "identical" has to be
      # decided by comparing the compiled half -- not by comparing something
      # nearby that is easier to reach.
      #
      # IT USED TO COMPARE THE DOCKERFILE HASH ALONE, and the converse it
      # relied on is false. Its reasoning was "the previous image carries the
      # hash of the Dockerfile it was built from, and if this tree's differs
      # then something compiled DID change" -- true, and the useful direction
      # is the other one. The parser .so is not compiled here at all; it is
      # downloaded from a get-percolate release (see the fetch step). So a
      # different parser release, or the same tag re-pointed, changes every
      # byte of the parser while dev/Dockerfile.pg19 stays identical, the
      # precondition passes in exactly the case it exists to refuse, and the
      # run reports that it proved the binaries unchanged while publishing
      # binaries nothing inspected. Live instance: REM-51/65 changed
      # extension/percolate_parser/src/graph.rs and no Dockerfile.
      #
      # THREE TERMS NOW, and the digest is the decisive one:
      #   dockerfile-sha        -- the layers this tree would build
      #   parser-release        -- which release the .so files came from
      #   parser-so-sha256      -- the bytes themselves
      # A term the published image does not record is a REFUSAL, not a pass:
      # an image published before this check existed cannot prove anything
      # about its parser, and one full run is what establishes it.
      #
      # IT RUNS WHETHER OR NOT THIS RUN PUSHES, which the Dockerfile-only
      # version did not (`inputs.push &&`). A gate that only exists on the run
      # that publishes cannot be rehearsed, and "make a new gate fail once on
      # purpose" then means risking a publish to find out. With push: false
      # this job builds nothing that leaves the runner, so the precondition is
      # dispatchable on its own, costs a manifest inspect, and answers the
      # only question a dry run has: would this fast path have been allowed.
      - name: Refuse the fast path when the compiled half changed
        if: ${{ !inputs.verify_binaries }}
        env:
          WANT_TAG: ${{ steps.parser.outputs.tag }}
          WANT_SO:  ${{ steps.parser.outputs.so_sha256 }}
        run: |
          set -euo pipefail
          # `.Image` is a MAP KEYED BY PLATFORM on a multi-arch manifest, not
          # a single config, so the obvious `.Image.Config.Labels` silently
          # returns empty and the check reports "no label" for an image that
          # has one -- a false negative that sends you down the slow path
          # forever. Both platforms carry identical labels here, so reading the
          # first entry is the whole answer.
          labels=$(docker buildx imagetools inspect \
                     percolationlabs/percolate-postgres:19 --format '{{ json .Image }}' \
                   2>/dev/null \
                   | jq -c 'to_entries[0].value.config.Labels // {}' \
                   2>/dev/null || echo '{}')
          label() { printf '%s' "$labels" | jq -r --arg k "$1" '.[$k] // empty'; }
          prev_dockerfile=$(label org.percolate.dockerfile-sha)
          prev_tag=$(label org.percolate.parser-release)
          prev_so=$(label org.percolate.parser-so-sha256)
          now_dockerfile='${{ hashFiles('dev/Dockerfile.pg19') }}'

          # A published `latest` is NOT A VALUE, it is the absence of one.
          # Images built before the fetch step resolved the tag carry the
          # literal string, and accepting it would compare 'latest' to
          # 'latest' -- this whole defect, one level out.
          if [ "$prev_tag" = latest ]; then
            echo "the published image records its parser release as 'latest', which names" >&2
            echo "no particular build; treating it as unrecorded." >&2
            prev_tag=
          fi

          # THE TABLE GOES TO STDERR, with the errors, and that is not a
          # preference. stdout through the runner's pipe is block-buffered and
          # stderr is not, so on the first run of this check the three
          # ::error:: lines appeared BEFORE the row whose values they were
          # explaining -- a log that reads as if the digest term failed for
          # the release named one line above it. Same stream, same order.
          row() { printf '%-22s %-34s %s\n' "$1" "$2" "$3" >&2; }
          row term published 'this run'
          row dockerfile-sha "${prev_dockerfile:-(none)}" "$now_dockerfile"
          row parser-release "${prev_tag:-(none)}" "$WANT_TAG"
          row parser-so-sha256 "${prev_so:-(none)}" "$WANT_SO"

          fail=0
          compare() {
            what=$1 prev=$2 now=$3
            if [ -z "$prev" ]; then
              echo "::error::the published image records no $what, so the fast path cannot" >&2
              echo "::error::prove the compiled half is unchanged. Re-run with" >&2
              echo "::error::verify_binaries: true once, to establish it." >&2
              fail=1
            elif [ "$prev" != "$now" ]; then
              echo "::error::$what changed since the published image:" >&2
              echo "::error::  published: $prev" >&2
              echo "::error::  this run:  $now" >&2
              fail=1
            fi
          }
          compare 'Dockerfile hash (dev/Dockerfile.pg19)' "$prev_dockerfile" "$now_dockerfile"
          compare 'parser release'   "$prev_tag" "$WANT_TAG"
          compare 'parser .so digest' "$prev_so" "$WANT_SO"
          [ "$fail" = 0 ] || {
            echo "::error::That is the FULL path -- re-run with verify_binaries: true." >&2
            exit 1; }
          echo "fast path allowed: Dockerfile, parser release and parser .so digests all" >&2
          echo "match the image that passed the portability gate." >&2

      - uses: docker/build-push-action@v6
        with:
          context: dev
          file: dev/Dockerfile.pg19
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          # THE REASON A RELEASE TOOK EIGHT MINUTES. Without a cache an
          # ephemeral runner recompiles pgvector and pg_cron from source for
          # both architectures on every run, with arm64 under QEMU emulation --
          # 446 of the 502 seconds, measured. Those layers change when the
          # Dockerfile does, which is rarely; the extension SQL changes on
          # every spec edit, which is constantly, and it is COPY'd near the end
          # on purpose. So the layer ordering was already right and the cache
          # is what lets it pay off.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Recorded ON the image so the fast path above can check its own
          # precondition instead of trusting whoever ticked the box. The
          # parser labels are RESOLVED VALUES: the tag `latest` pointed at
          # when this ran, and the digests of the .so files that release
          # served. An image labelled `latest` says nothing about which
          # binaries it carries, and the precondition treats it as unrecorded.
          labels: |
            org.percolate.dockerfile-sha=${{ hashFiles('dev/Dockerfile.pg19') }}
            org.percolate.parser-release=${{ steps.parser.outputs.tag }}
            org.percolate.parser-so-sha256=${{ steps.parser.outputs.so_sha256 }}
            org.percolate.parser-so-amd64-sha256=${{ steps.parser.outputs.amd64_sha256 }}
            org.percolate.parser-so-arm64-sha256=${{ steps.parser.outputs.arm64_sha256 }}
          # Two tags, and the second one is the point. `19` is the Postgres
          # major and is mutable -- it is what the compose file and the chart
          # pull, and it moves every release. `19-<version>` never moves, so a
          # deployment can pin a known extension build and an upgrade is a
          # visible edit rather than whatever `19` happens to mean today.
          # Without it there is no way to say which build a cluster is running,
          # which matters more than usual here: pre-1.0 there is no in-place
          # extension upgrade, so pinning IS the upgrade strategy.
          # ONLY THE IMMUTABLE TAG IS PUSHED HERE. `19` is moved at the end of
          # this job, after the checks below have passed, and that ordering is
          # the whole point of having them: pushing both tags up front meant
          # the portability gate ran AFTER the mutable tag every user pulls had
          # already moved to the image it was about to refuse. A gate that
          # opens the door and then inspects the visitor is a report.
          tags: |
            percolationlabs/percolate-postgres:19-${{ inputs.version }}

      - name: Confirm both architectures are in the manifest
        if: inputs.push
        run: |
          for t in 19-${{ inputs.version }}; do
            m=$(docker buildx imagetools inspect "percolationlabs/percolate-postgres:$t")
            echo "$m" | grep -q linux/amd64 || { echo "::error::$t has no amd64" >&2; exit 1; }
            echo "$m" | grep -q linux/arm64 || { echo "::error::$t has no arm64" >&2; exit 1; }
          done

      # THE CHECK THAT WOULD HAVE CAUGHT v0.1.0, and the reason it is a static
      # one. That image killed the backend with `signal 4: Illegal instruction`
      # on the first `<=>`, on every Apple Silicon machine: pgvector's Makefile
      # defaults to -march=native, CI builds arm64 on Neoverse runners which
      # have SVE, and Apple Silicon does not implement SVE.
      #
      # A smoke test that RAN a query here would not have found it. The runner
      # executes the image on the CPU it was just built on, where the
      # instructions are legal -- the defect only appears on a CPU different
      # from the builder's, which is every user's and no runner's. So the
      # observable is not "does a query work" but "does this binary contain
      # instructions outside the architecture baseline", which is answerable
      # from the disassembly without executing anything.
      #
      # Inserting a vector worked on the broken image; only the distance
      # function carried the instructions. That is why this looks at the
      # library rather than at whether the extension loads.
      - name: Refuse a build compiled for the builder's own CPU
        if: inputs.push && inputs.verify_binaries
        run: |
          # SCOPED TO THE FUNCTION THE INSTRUCTION SITS IN, which the first
          # version of this check was not -- and it refused a correct build.
          #
          # pgvector 0.8.x ships EXPLICIT AVX-512 kernels and selects them at
          # runtime: BitHammingDistanceAvx512Popcount and its Jaccard twin are
          # compiled with a target attribute and reached only through a CPU
          # feature test. A portable build therefore CONTAINS zmm instructions
          # by design, and counting them across the whole library cannot tell
          # that apart from -march=native. Measured on the published image:
          # 20 such instructions, all of them inside those two functions, with
          # 108 cpuid/__cpu_model sites gating the dispatch.
          #
          # What -march=native actually looks like is the opposite -- the
          # instructions are everywhere, in the ordinary distance and
          # quantisation loops, not confined to two functions whose names say
          # what they are. So the observable is "does a function that is NOT a
          # dispatched kernel carry non-baseline instructions", which is still
          # answerable from the disassembly and no longer confuses a deliberate
          # runtime-dispatched kernel with an accident of the builder's CPU.
          fail=0
          for a in amd64 arm64; do
            case $a in
              # SVE (Neoverse and later): absent from Apple Silicon.
              arm64) bad='ptrue|whilelt|ld1[bhwd]|st1[bhwd]' ;;
              # AVX-512: absent from most consumer and older server parts.
              amd64) bad='%zmm|kmov[bwdq]|vpternlog' ;;
            esac
            # Functions whose names declare them as explicitly-dispatched
            # kernels. Anything else carrying these instructions is the bug.
            dispatched='Avx512|Avx2|Sve|Neon|Dispatch'
            fns=$(docker run --rm --platform "linux/$a" \
                  "percolationlabs/percolate-postgres:19-${{ inputs.version }}" \
                  sh -c "objdump -d /usr/lib/postgresql/19/lib/vector.so \
                         | awk '/^[0-9a-f]+ </ {fn=\$2} /$bad/ {print fn}' \
                         | sort -u" || true)
            offenders=$(printf '%s\n' "$fns" | grep -vE "$dispatched" | grep . || true)
            echo "$a: functions with non-baseline instructions: ${fns:-none}"
            [ -z "$offenders" ] || {
              echo "::error::vector.so for $a was compiled for the build machine's CPU" >&2
              echo "::error::non-baseline instructions outside a dispatched kernel: $offenders" >&2
              echo "::error::pass OPTFLAGS=\"\" to pgvector's make -- see dev/Dockerfile.pg19" >&2
              fail=1; }
          done
          [ "$fail" = "0" ]

      # The mutable tag moves LAST, and only if everything above passed. This
      # is a manifest copy rather than a rebuild, so `19` and `19-<version>`
      # are the same digests by construction -- there is no window in which
      # they could be two different builds.
      - name: Move the :19 tag onto the verified build
        if: inputs.push
        run: |
          docker buildx imagetools create \
            -t percolationlabs/percolate-postgres:19 \
            percolationlabs/percolate-postgres:19-${{ inputs.version }}
          docker buildx imagetools inspect percolationlabs/percolate-postgres:19 \
            | grep -E 'linux/(amd64|arm64)'
