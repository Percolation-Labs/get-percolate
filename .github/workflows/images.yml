# Rebuild percolate-postgres WITHOUT cutting an extension release.
#
# The escape hatch, not the release path. A release publishes the image as its
# last step (parser.yml -> image), so this is for the cases where the image has
# to move and the extension has not: a base-image CVE, a pgvector bump, a fix
# in Dockerfile.pg19 itself.
#
# It used to build percolate-core here too. That job is gone: percolate-core's
# own release.yml builds and pushes that image now, and an image built in two
# places is two answers to "which tag is current" -- the exact mistake
# PACKAGING.md argues one image over three to avoid.
name: images

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          extension version already released -- the .so files are taken from
          that release and the image is tagged :19 and :19-<version>
        required: true
      ref:
        description: p8-subsystems ref to build the extension SQL from
        default: main
      push:
        description: push to Docker Hub
        type: boolean
        default: false
      verify_binaries:
        description: >-
          FULL path -- recompile and re-run the CPU-portability gate. Leave
          off when only the extension SQL changed (the fast path, ~1 min);
          turn on when the Dockerfile, pgvector, pg_cron, the base image or
          the parser release changed (~8 min). image-postgres.yml's header
          says why the two are separate.
        type: boolean
        default: false

jobs:
  postgres:
    uses: ./.github/workflows/image-postgres.yml
    with:
      ref: ${{ inputs.ref }}
      version: ${{ inputs.version }}
      parser_release: v${{ inputs.version }}
      push: ${{ inputs.push }}
      verify_binaries: ${{ inputs.verify_binaries }}
    secrets:
      SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
