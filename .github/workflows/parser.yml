# Build the extension release assets: the SQL extension (one file, every
# platform) and percolate_parser.so (one file PER platform).
#
# Natively, not under emulation. Cross-building the Rust toolchain with QEMU
# works and takes the better part of an hour per architecture; a native runner
# does it in minutes and is the difference between "CI builds the matrix" and
# "someone builds it on their laptop when they remember".
name: extension

# The run NAMES ITSELF after the version it is publishing, because the caller
# has to find it. `gh workflow run` returns nothing -- there is no run id yet --
# so p8-subsystems' release.yml dispatches this and then goes looking. It used
# to look for "the newest run created after I dispatched", which is a guess
# about a clock: two releases in flight, or a queued runner, and it watches the
# wrong one and reports its result. Matching on this name cannot pick the wrong
# run.
run-name: extension ${{ inputs.version || inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: p8-subsystems ref to build from
        default: main
      version:
        description: >-
          extension version to publish. Set it and this cuts a release
          (assets + image); leave it empty and it only builds, which is the
          check you want on a branch.
        default: ""
      push_image:
        description: push percolate-postgres to Docker Hub
        type: boolean
        default: true

# THE VERSION IS AN INPUT, NOT A TAG ON THIS REPO. The extension's source is
# p8-subsystems and so is its version -- `percolate.control`'s default_version.
# This used to fire on a `v*` tag pushed HERE, which put the tag on the repo
# that does not hold the source and left every release asset named 0.1.0
# forever. p8-subsystems' release.yml bumps, tags and dispatches this with the
# number it just wrote; the job below verifies the ref actually carries it.

# THE SOURCE REPOSITORY IS PRIVATE, so it is named by a repository variable
# rather than hardcoded here: this repo is public, and a public workflow should
# not publish the layout of a private one. Set them once, per repo:
#
#   gh variable set SPECS_REPO  --body '<owner>/<specs-repo>'
#   gh secret   set SOURCE_TOKEN --body '<PAT with read access to it>'
#
# Without them these jobs do not run, which is the correct behaviour for a fork:
# a fork cannot build the extension and should fail saying so rather than
# checking out nothing and publishing an empty release.

permissions:
  contents: write        # to create the release and upload assets

jobs:
  sql:
    # Architecture-independent, so it is built once and not in the matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SPECS_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          ref: ${{ inputs.ref }}
      - name: Confirm the ref carries the version being released
        if: inputs.version != ''
        run: |
          have=$(sed -n "s/^default_version = '\(.*\)'/\1/p" extension/percolate/percolate.control)
          [ "$have" = "${{ inputs.version }}" ] || {
            echo "::error::ref ${{ inputs.ref }} is extension $have, not ${{ inputs.version }}" >&2
            exit 1; }

      - name: Generate the extension SQL from specs/
        # Generated rather than committed: the spec files are what get reviewed
        # and tested, and a hand-copied extension script would be a second copy
        # to drift. build-sql.py also refuses to build a spec file that defines
        # the same function twice, which is a real thing that happened.
        run: python3 extension/percolate/build-sql.py
      - uses: actions/upload-artifact@v4
        with:
          name: sql
          path: |
            extension/percolate/sql/percolate--*.sql
            extension/percolate/percolate.control

  parser:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native per architecture, never under emulation: cross-building the
          # Rust toolchain with QEMU works and takes the better part of an hour.
          - {os: ubuntu-latest,    platform: linux-amd64, docker: linux/amd64}
          - {os: ubuntu-24.04-arm, platform: linux-arm64, docker: linux/arm64}
          - {os: macos-14,         platform: macos-arm64, docker: ''}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SPECS_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          ref: ${{ inputs.ref }}

      # THE HEADERS MUST COME FROM THE SERVER THE .so WILL BE LOADED INTO, and
      # three attempts at installing them on a bare runner each failed one step
      # later than the last: a missing `signed-by=` on the PGDG sources line,
      # then a missing `-pgdg-testing` component, then the fact that PGDG ships
      # no PG19 package for Ubuntu at all while 19 is in beta. Letting pgrx
      # build the server instead got as far as `configure: error: readline
      # library not found` -- and would have been wrong even had it worked,
      # because cargo-pgrx 0.19.2 pins 19BETA2 and the image runs 19beta3.
      # A .so built against one beta's headers and loaded into another's server
      # is not a thing to ship, and it is not a thing a test would catch.
      #
      # p8-subsystems already solves this, and has since before this workflow
      # existed: dev/Dockerfile.pgrx-builder starts FROM the same
      # postgres:19beta3-bookworm the runtime image is built on and installs
      # postgresql-server-dev-19 from ITS Debian repo. Its own header says it
      # was made self-contained so that `--platform` works and so it runs on a
      # CI runner. This workflow was reinventing it, badly.
      # The crate compile is CHEAP -- 74 s from an empty target directory,
      # measured, pgrx-pg-sys bindgen and all. What is not cheap is paying for
      # it three times per release across the matrix, and rebuilding the
      # builder image each time to do it. Both are cached on what actually
      # invalidates them: the Dockerfile for the image, and the pgrx pin plus
      # the lockfile for the crates.
      #
      # `target/` lives under the workspace because the container mounts it
      # there, which is what makes it cacheable at all -- the compile happens
      # inside a container, but its output lands on the runner's disk.
      - name: Cache the pgrx builder image and the crate build
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            extension/percolate_parser/target
            extension/percolate_parser/.pgrx
            ~/.cargo/registry
          key: pgrx-${{ matrix.platform }}-${{ hashFiles('dev/Dockerfile.pgrx-builder', 'extension/percolate_parser/Cargo.lock') }}
          restore-keys: pgrx-${{ matrix.platform }}-

      - name: Build the parser in the image that ships the target server
        if: runner.os == 'Linux'
        working-directory: dev
        run: |
          # Layer cache for the builder image, so the PGDG install inside it is
          # not repeated on every run. type=gha is scoped per repository and
          # evicted by GitHub, so a miss is a normal build rather than an error.
          docker buildx build --platform ${{ matrix.docker }} \
            -f Dockerfile.pgrx-builder -t pgrx-builder --load \
            --cache-from type=gha,scope=pgrx-${{ matrix.platform }} \
            --cache-to type=gha,mode=max,scope=pgrx-${{ matrix.platform }} .
          docker run --rm --platform ${{ matrix.docker }} \
            -v "$GITHUB_WORKSPACE/extension/percolate_parser":/work \
            -e PGRX_HOME=/work/.pgrx -w /work pgrx-builder bash -c '
              cargo pgrx init --pg19 /usr/bin/pg_config >/dev/null 2>&1 || true
              cargo pgrx package --features pg19 --no-default-features \
                                 --pg-config /usr/bin/pg_config'
          # The container writes as root; the cache action has to read it back.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/extension/percolate_parser"

      # macOS has no container and Homebrew has no postgresql@19 while 19 is in
      # beta, so this is the one platform with no existing pattern to reuse. It
      # builds the server from source -- but the SAME beta the image runs, read
      # out of the builder Dockerfile rather than written here, so the two
      # cannot drift into the ABI mismatch described above. Everything optional
      # is switched off: this exists to produce pg_config and headers, not a
      # working server.
      # THE THREE THINGS macOS REBUILDS, AND WHAT EACH IS KEYED ON.
      #
      # This platform was the release's critical path by a wide margin: it
      # compiled PostgreSQL from source AND compiled cargo-pgrx from source,
      # from scratch, on every release -- for a schema change that touched no
      # Rust at all. Both are pinned artefacts, so both are cacheable, and the
      # key is the pin itself: the cache is reused exactly while the thing it
      # was built from has not moved, and a miss only costs what it used to
      # cost every time.
      #
      # Keyed on the PIN and not on a lockfile hash on purpose. Hashing the
      # crate would have looked more thorough and reused nothing: the release
      # bumps Cargo.toml's version every time, so a key derived from it changes
      # every release by construction, and the cache would never hit.
      - name: Read the pinned versions
        if: runner.os == 'macOS'
        id: pins
        run: |
          V=$(sed -n 's/^FROM postgres:\([0-9a-z.]*\)-.*/\1/p' dev/Dockerfile.pgrx-builder)
          [ -n "$V" ] || { echo "::error::could not read the PG version from dev/Dockerfile.pgrx-builder" >&2; exit 1; }
          echo "pg=$V" >> "$GITHUB_OUTPUT"
          # One home for the pgrx pin, so the cache key and the install below
          # cannot name different versions.
          echo "pgrx=0.19.2" >> "$GITHUB_OUTPUT"

      - name: Cache the built server
        if: runner.os == 'macOS'
        id: pgcache
        uses: actions/cache@v4
        with:
          path: ~/pg
          key: pg-src-${{ runner.os }}-${{ steps.pins.outputs.pg }}

      - name: Build PG from source for the headers
        # Only on a miss. It exists to produce pg_config and headers, not a
        # working server, which is why everything optional is switched off.
        if: runner.os == 'macOS' && steps.pgcache.outputs.cache-hit != 'true'
        run: |
          V=${{ steps.pins.outputs.pg }}
          echo "building postgres $V"
          curl -fsSL "https://ftp.postgresql.org/pub/source/v$V/postgresql-$V.tar.bz2" | tar xj
          cd "postgresql-$V"
          ./configure --prefix="$HOME/pg" --without-readline --without-zlib \
                      --without-icu --without-llvm >/dev/null
          make -j3 >/dev/null && make install >/dev/null

      - name: Point at it
        if: runner.os == 'macOS'
        # Outside the build step, because it has to happen on a cache hit too.
        run: echo "PG_CONFIG=$HOME/pg/bin/pg_config" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS'

      - name: Cache cargo-pgrx and the crate registry
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-pgrx
            ~/.cargo/registry
            ~/.cargo/git
            extension/percolate_parser/target
          key: pgrx-${{ runner.os }}-${{ steps.pins.outputs.pgrx }}-${{ hashFiles('extension/percolate_parser/Cargo.lock') }}
          restore-keys: pgrx-${{ runner.os }}-${{ steps.pins.outputs.pgrx }}-

      - name: cargo-pgrx
        if: runner.os == 'macOS'
        # Pinned. pgrx generates the FFI shims against a specific PG ABI, so
        # "whatever is latest" is a silent correctness dependency. Skipped when
        # the cached binary already reports the pinned version -- checked rather
        # than assumed, because a restore-keys hit can carry an older one.
        run: |
          want=${{ steps.pins.outputs.pgrx }}
          have=$(cargo pgrx --version 2>/dev/null | awk '{print $2}' || true)
          if [ "$have" = "$want" ]; then
            echo "cargo-pgrx $want already present"
          else
            cargo install --locked cargo-pgrx --version "$want"
          fi

      - name: Build
        if: runner.os == 'macOS'
        working-directory: extension/percolate_parser
        # -undefined dynamic_lookup is not optional on macOS and is not a
        # workaround. A Postgres extension is a shared library whose Postgres
        # symbols -- ErrorContext, FreeErrorData, error_context_stack -- are
        # resolved by the SERVER at load time, and Mach-O's linker refuses
        # undefined symbols by default where ELF does not. Without it the build
        # gets all the way through compilation and fails at the link with a
        # wall of undefined `_pg*` symbols, which reads like a broken crate and
        # is a missing flag. Linux needs nothing here, which is why the
        # container path above says nothing about it.
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-undefined,dynamic_lookup"
        run: |
          cargo pgrx init --pg19 "$PG_CONFIG"
          cargo pgrx package --features pg19 --no-default-features --pg-config "$PG_CONFIG"

      - name: Collect
        working-directory: extension/percolate_parser
        run: |
          mkdir -p out
          find target -name 'percolate_parser.so' -o -name 'percolate_parser.dylib' \
            | head -1 | xargs -I{} cp {} "out/percolate_parser-${{ matrix.platform }}.so"
          # The glob must catch percolate_parser--0.1.0.sql, whose name has no
          # dot immediately after the stem: "percolate_parser.*" misses it.
          find target -path '*extension/percolate_parser*' \
            \( -name 'percolate_parser.control' -o -name 'percolate_parser--*.sql' \) \
            -exec cp {} out/ \;
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: parser-${{ matrix.platform }}
          path: extension/percolate_parser/out/*

  release:
    needs: [sql, parser]
    runs-on: ubuntu-latest
    if: inputs.version != ''
    steps:
      - uses: actions/download-artifact@v4
        with: {path: assets}
      - name: Flatten and check the manifest
        env: {V: "${{ inputs.version }}"}
        run: |
          mkdir -p out && find assets -type f -exec cp -n {} out/ \;
          ls -la out/
          # install.sh downloads by exact name -- it reads the version out of
          # the control file and then asks for percolate--<that>.sql. A missing
          # or misnamed asset is a broken install path that nothing else would
          # notice until someone ran the curl | sh.
          for f in percolate.control "percolate--$V.sql" \
                   percolate_parser.control "percolate_parser--$V.sql" \
                   percolate_parser-linux-amd64.so percolate_parser-linux-arm64.so \
                   percolate_parser-macos-arm64.so; do
            [ -f "out/$f" ] || { echo "::error::missing release asset: $f" >&2; exit 1; }
          done
          # And the control files must agree with the number being published,
          # or install.sh will resolve a script this release does not carry.
          for c in percolate percolate_parser; do
            have=$(sed -n "s/^default_version = '\(.*\)'/\1/p" "out/$c.control")
            [ "$have" = "$V" ] || {
              echo "::error::$c.control says $have, releasing $V" >&2; exit 1; }
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Extension v${{ inputs.version }}
          files: out/*
          generate_release_notes: true
          body: |
            The Percolate Postgres extensions, built from p8-subsystems
            `${{ inputs.ref }}`.

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```

            Or pull the image, which carries the same build:
            `percolationlabs/percolate-postgres:19-${{ inputs.version }}`

            **Pre-1.0 there is no in-place upgrade.** These extensions ship no
            `percolate--<old>--<new>.sql`, so `ALTER EXTENSION percolate UPDATE`
            has nothing to run. Pin the version you install; moving to a new one
            means a fresh database.

  # The image comes last and only after the assets exist, because it fetches
  # the .so files FROM this release -- the same bytes install.sh hands out.
  # Order is the whole point: publish what the image needs, then the image,
  # then (in p8-subsystems' release.yml) the docs that reference both.
  image:
    needs: release
    if: inputs.version != ''
    uses: ./.github/workflows/image-postgres.yml
    with:
      ref: ${{ inputs.ref }}
      version: ${{ inputs.version }}
      parser_release: v${{ inputs.version }}
      push: ${{ inputs.push_image }}
    secrets:
      SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # ---------------------------------------------------------------------
  # THE DOCS CATCH THEMSELVES UP.
  #
  # This used to be a GitHub issue, opened by p8-subsystems' release.yml,
  # asking @claude to find every version quoted in prose and open a PR. It did
  # not work -- three pages still said the dialect was 0.1.0 after the
  # extension went to 0.1.1, and nothing reported it, because stale prose reads
  # exactly like current prose.
  #
  # Now the pages hold @@extension@@ and the number lives in versions.toml, so
  # catching up is one edit to one file. docs.yml refuses to build a site whose
  # numbers disagree with it, which is what makes this step load-bearing rather
  # than decorative.
  #
  # LAST, after the image. The number here means "published", so it must not
  # move until the thing it names exists -- a doc that names an artifact half a
  # minute before it is pushable sends a reader to a 404.
  # ---------------------------------------------------------------------
  docs-version:
    needs: image
    if: inputs.version != '' && inputs.push_image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}   # tomllib is stdlib from 3.11

      - name: Point the docs at ${{ inputs.version }}
        run: python3 ci/versions.py --set published.extension=${{ inputs.version }}

      - name: Commit, if anything moved
        run: |
          # Nothing to commit is the normal case for a re-run, not a failure.
          git diff --quiet && { echo "already at ${{ inputs.version }}"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: extension ${{ inputs.version }}"
          # Rebase before pushing: percolate-core's release writes the SAME file
          # for a different key, and the two are independent buttons that can be
          # pressed minutes apart. Without this the second one to finish fails
          # on a non-fast-forward after everything it was gating has already
          # been published -- a red run for a release that actually succeeded.
          for _ in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
          done
          echo "::error::could not push the version bump after three rebases" >&2
          exit 1
