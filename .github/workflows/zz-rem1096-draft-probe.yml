# TEMPORARY, REMOVED BEFORE MERGE (REM-1096): proves that the Actions token can
# find a draft release by its tag name and download its asset, which the image
# job now depends on. Creates a draft (no tag), downloads, compares, deletes.
name: rem1096-draft-probe
on:
  pull_request:
    paths: ['.github/workflows/zz-rem1096-draft-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      T: v0.0.0-rem1096-probe-${{ github.run_id }}
    steps:
      - run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          echo "probe $GITHUB_RUN_ID" > probe.txt
          gh release create "$T" --repo "$R" --draft --title "REM-1096 probe, deleting" --notes throwaway probe.txt
          trap 'gh release delete "$T" --repo "$R" --yes || true' EXIT
          [ "$(git ls-remote --tags "https://github.com/$R.git" "refs/tags/$T" | wc -l)" = 0 ] && echo "no tag for the draft"
          [ "$(gh release view "$T" --repo "$R" --json isDraft --jq .isDraft)" = true ]
          gh release download "$T" --repo "$R" --pattern probe.txt --output got.txt --clobber
          cmp probe.txt got.txt && echo "the Actions token downloaded the draft's asset, identical bytes"
