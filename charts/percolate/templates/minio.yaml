{{- if and .Values.minio.enabled (not .Values.objectStorage.external.endpoint) }}
{{- /*
  Bundled object store, for getting started: RustFS, S3-compatible, under the
  name `minio` so services and values from earlier charts keep working (the
  compose file does the same). MinIO's free images no longer pull anonymously. Object storage is REQUIRED, not optional:
  an oversized step output is offloaded to it and refd from the task, and the
  Content Server keeps every uploaded byte there. Point objectStorage.external
  at S3, R2, GCS or your own MinIO for anything you care about. Setting
  objectStorage.external.endpoint is enough: this pod is then not rendered,
  because nothing would talk to it (every service reads percolate.s3Endpoint).
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "percolate.fullname" . }}-minio
  labels: {{- include "percolate.labels" . | nindent 4 }}
spec:
  ports:
    - {port: 9000, targetPort: api, name: api}
    - {port: 9001, targetPort: console, name: console}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "percolate.fullname" . }}-minio
  labels: {{- include "percolate.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "percolate.fullname" . }}-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        {{- include "percolate.labels" . | nindent 8 }}
        app.kubernetes.io/component: minio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      # A VOLUME AN EARLIER CHART'S MinIO WROTE is owned by uid 1000, and RustFS
      # runs as 10001 and cannot write it. This hands such a volume over once,
      # and does nothing on a fresh one -- compose's `minio-perms`, here.
      initContainers:
        - name: hand-volume-to-rustfs
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          securityContext: {runAsUser: 0, runAsNonRoot: false}
          command: ["sh", "-c"]
          args:
            - |
              if [ -n "$(find /data ! -user 10001 -print -quit)" ]; then
                echo "data: files not owned by uid 10001 (a MinIO volume?), handing it to 10001"
                chown -R 10001:10001 /data
              fi
          volumeMounts: [{name: data, mountPath: /data}]
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ include "percolate.secretName" . }}, key: s3-key}}
            - name: RUSTFS_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ include "percolate.secretName" . }}, key: s3-secret}}
          ports:
            - {containerPort: 9000, name: api}
            - {containerPort: 9001, name: console}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: api}
            initialDelaySeconds: 5
          volumeMounts: [{name: data, mountPath: /data}]
  {{- if .Values.minio.persistence.enabled }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.minio.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.minio.persistence.size }}}}
  {{- else }}
      volumes: [{name: data, emptyDir: {}}]
  {{- end }}
{{- end }}
