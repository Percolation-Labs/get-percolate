{{- if .Values.minio.enabled }}
{{- /*
  Bundled MinIO, for getting started. Object storage is REQUIRED, not optional:
  an oversized step output is offloaded to it and refd from the task, and the
  Content Server keeps every uploaded byte there. Point objectStorage.external
  at S3, R2, GCS or your own MinIO for anything you care about, and set
  minio.enabled: false.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "percolate.fullname" . }}-minio
  labels: {{- include "percolate.labels" . | nindent 4 }}
spec:
  ports:
    - {port: 9000, targetPort: api, name: api}
    - {port: 9001, targetPort: console, name: console}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "percolate.fullname" . }}-minio
  labels: {{- include "percolate.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "percolate.fullname" . }}-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        {{- include "percolate.labels" . | nindent 8 }}
        app.kubernetes.io/component: minio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: {{ include "percolate.secretName" . }}, key: s3-key}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "percolate.secretName" . }}, key: s3-secret}}
          ports:
            - {containerPort: 9000, name: api}
            - {containerPort: 9001, name: console}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: api}
            initialDelaySeconds: 5
          volumeMounts: [{name: data, mountPath: /data}]
  {{- if .Values.minio.persistence.enabled }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.minio.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.minio.persistence.size }}}}
  {{- else }}
      volumes: [{name: data, emptyDir: {}}]
  {{- end }}
{{- end }}
