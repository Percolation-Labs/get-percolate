{{- if not .Values.secrets.existingSecret }}
{{- /*
  Fail at RENDER time, not at pod start. A missing password becomes
  CrashLoopBackOff with "password authentication failed" three layers down,
  which is a slow way to learn that a value was not set. `required` turns it
  into one line at `helm install`, before anything is created.

  Deliberately NOT generated with randAlphaNum: a generated password differs
  between `helm template` and `helm install`, and between a GitOps dry run and
  the apply after it -- so the rendered manifest and the live cluster disagree
  about the database password with nothing reporting it. Flux and Argo both
  diff continuously; a self-generating secret makes that diff permanent.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "percolate.fullname" . }}-secrets
  labels: {{- include "percolate.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "secrets.postgresPassword is required (or set secrets.existingSecret)" .Values.secrets.postgresPassword | quote }}
  authenticator-password: {{ required "secrets.authenticatorPassword is required (or set secrets.existingSecret)" .Values.secrets.authenticatorPassword | quote }}
  worker-password: {{ required "secrets.workerPassword is required (or set secrets.existingSecret)" .Values.secrets.workerPassword | quote }}
  jwt-secret: {{ required "secrets.jwtSecret is required -- HS256, at least 32 bytes (or set secrets.existingSecret)" .Values.secrets.jwtSecret | quote }}
  s3-key: {{ .Values.secrets.s3Key | default "p8admin" | quote }}
  s3-secret: {{ .Values.secrets.s3Secret | default "p8password" | quote }}
  llm-api-key: {{ .Values.secrets.llmApiKey | default "" | quote }}
{{- end }}
