{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | default (include "percolate.fullname" .) }}
  labels: {{- include "percolate.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# No RoleBinding. None of these processes talks to the Kubernetes API -- the
# only thing that would is the pool manager, which is a separate command with
# its own RBAC. A ServiceAccount with no permissions is the point.
automountServiceAccountToken: false
{{- end }}
