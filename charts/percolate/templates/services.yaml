{{- /*
  The three HTTP surfaces. One image, three commands -- so this is one template
  with a range rather than three near-identical files that drift.
*/ -}}
{{- $svcs := list }}
{{- if .Values.postgrest.enabled }}{{ $svcs = append $svcs (dict "name" "postgrest" "port" 3000 "cfg" .Values.postgrest) }}{{ end }}
{{- if .Values.content.enabled }}{{ $svcs = append $svcs (dict "name" "content" "port" 8081 "cfg" .Values.content "cmd" (list "content" "serve")) }}{{ end }}
{{- if .Values.agent.enabled }}{{ $svcs = append $svcs (dict "name" "agent" "port" 8080 "cfg" .Values.agent "cmd" (list "agent" "serve")) }}{{ end }}
{{- range $s := $svcs }}
{{- $root := $ }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "percolate.fullname" $root }}-{{ $s.name }}
  labels: {{- include "percolate.labels" $root | nindent 4 }}
spec:
  ports: [{port: {{ $s.port }}, targetPort: http, name: http}]
  selector:
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: {{ $s.name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "percolate.fullname" $root }}-{{ $s.name }}
  labels: {{- include "percolate.labels" $root | nindent 4 }}
spec:
  replicas: {{ $s.cfg.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $s.name }}
  template:
    metadata:
      labels:
        {{- include "percolate.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $s.name }}
    spec:
      securityContext: {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      {{- if $root.Values.serviceAccount.create }}
      serviceAccountName: {{ $root.Values.serviceAccount.name | default (include "percolate.fullname" $root) }}
      {{- end }}
      containers:
        - name: {{ $s.name }}
          securityContext: {{- toYaml $root.Values.securityContext | nindent 12 }}
          {{- if eq $s.name "postgrest" }}
          image: "{{ $s.cfg.image.repository }}:{{ $s.cfg.image.tag }}"
          env:
            - name: P8_AUTHENTICATOR_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "percolate.secretName" $root }}, key: authenticator-password}}
            # $(VAR) interpolation, so the password is never a rendered literal
            # in the manifest -- a DSN built by the chart would put it straight
            # into `kubectl get deploy -o yaml` and into every GitOps diff.
            - name: PGRST_DB_URI
              value: {{ include "percolate.serviceDsn" $root | quote }}
            - name: PGRST_DB_SCHEMAS
              value: {{ $s.cfg.schemas | quote }}
            - name: PGRST_DB_ANON_ROLE
              value: web_anon
            - name: PGRST_JWT_SECRET
              valueFrom: {secretKeyRef: {name: {{ include "percolate.secretName" $root }}, key: jwt-secret}}
            # The admin server is what gives PostgREST a readiness answer:
            # /ready is 503 until the schema cache is loaded from the database,
            # /live is 200 whenever the process is up.
            - name: PGRST_ADMIN_SERVER_PORT
              value: "3001"
          readinessProbe:
            httpGet: {path: /ready, port: admin}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /live, port: admin}
            periodSeconds: 10
            failureThreshold: 6
          {{- else }}
          image: {{ include "percolate.image" $root | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args: {{- toYaml $s.cmd | nindent 12 }}
          env:
            - name: P8_AUTHENTICATOR_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "percolate.secretName" $root }}, key: authenticator-password}}
            - name: P8_DSN
              value: {{ include "percolate.serviceDsn" $root | quote }}
            {{- if eq $s.name "agent" }}
            # The Agent Runtime reads P8_DATABASE_URL first and P8_DSN after
            # it (from percolate-core 0.1.4; before that it read only the
            # former and fell back to localhost:5500). Both are set so a
            # release older than that still connects.
            - name: P8_DATABASE_URL
              value: {{ include "percolate.serviceDsn" $root | quote }}
            - name: LLM_API_KEY
              valueFrom: {secretKeyRef: {name: {{ include "percolate.secretName" $root }}, key: llm-api-key, optional: true}}
            # The provider's own variable. LLM_API_KEY above is the worker's
            # credential_ref mechanism and this runtime never reads it, so
            # without this the agent answers 200 and errors inside the stream.
            - name: OPENAI_API_KEY
              valueFrom: {secretKeyRef: {name: {{ include "percolate.secretName" $root }}, key: openai-api-key, optional: true}}
            {{- with $root.Values.agent.openaiBaseUrl }}
            - name: OPENAI_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            # Every other provider's own variable -- ANTHROPIC_API_KEY,
            # GEMINI_API_KEY and the rest -- because the model is a column and
            # the image carries every provider; see values.yaml agent.env.
            {{- with $root.Values.agent.env }}{{- toYaml . | nindent 12 }}{{- end }}
            {{- end }}
            {{- include "percolate.commonEnv" $root | nindent 12 }}
          {{- end }}
          {{- if eq $s.name "postgrest" }}
          ports: [{containerPort: {{ $s.port }}, name: http}, {containerPort: 3001, name: admin}]
          {{- else }}
          ports: [{containerPort: {{ $s.port }}, name: http}]
          # Content has a /health route; the Agent Runtime has none, so an
          # open port is the signal. Before these a pod was Ready the moment
          # its container started, and a rollout sent traffic to a process
          # still importing.
          readinessProbe:
            {{- if eq $s.name "content" }}
            httpGet: {path: /health, port: http}
            {{- else }}
            tcpSocket: {port: http}
            {{- end }}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
            failureThreshold: 6
          {{- end }}
          resources: {{- toYaml $s.cfg.resources | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      # readOnlyRootFilesystem is on, so anything that writes needs a real
      # volume. /tmp is the only one these processes use.
      volumes: [{name: tmp, emptyDir: {}}]
      {{- with $root.Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
