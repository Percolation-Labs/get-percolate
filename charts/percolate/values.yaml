# Percolate — defaults that come up on an empty cluster, and every knob a real
# deployment has to turn.
#
# Read the `secrets` block first. Everything else has a defensible default.

nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Credentials.
#
# The chart will NOT generate these. A generated password is a password that
# differs between `helm template` and `helm install`, and between a GitOps dry
# run and the apply that follows -- which is how a rendered manifest and a live
# cluster end up disagreeing about the database password with nothing saying
# so. Provide them, or point `existingSecret` at something you already manage
# (External Secrets, Sealed Secrets, SOPS).
# ---------------------------------------------------------------------------
secrets:
  # Name of a Secret you manage. When set, every value below is ignored and the
  # keys are read from it: postgres-password, authenticator-password,
  # worker-password, jwt-secret, s3-key, s3-secret -- and, optionally,
  # llm-api-key, openai-api-key and worker-api-key.
  existingSecret: ""

  # openssl rand -hex 24 for the two below. They are written into postgres://
  # URLs, and base64 output contains `/`, which ends the password there; the
  # chart refuses those characters at render time rather than crash-looping.

  postgresPassword: ""
  authenticatorPassword: ""
  workerPassword: ""
  # HS256, so at least 32 bytes: openssl rand -hex 32. Keep it: it is also
  # what you sign tokens with (`percolate auth token --secret ...`).
  jwtSecret: ""
  # THE AGENT RUNTIME'S PROVIDER KEY, which is not llmApiKey. The runtime calls
  # models through pydantic-ai, which reads the variable its provider names --
  # OPENAI_API_KEY -- and never looks at LLM_API_KEY. Set only the latter and
  # you get a saved agent, a 200 on /chat, and a RUN_ERROR about missing
  # credentials inside the stream. Point agent.openaiBaseUrl at an
  # OpenAI-shaped gateway to use one with the same client.
  openaiApiKey: ""

  # Resolved by NAME when a step names it as credential_ref -- the WORKER'S
  # mechanism, for http_call and embedding steps. Empty is fine if no step
  # calls a model. With OpenAI embeddings it is the same key as openaiApiKey.
  llmApiKey: ""

  # The token an `agent:` workflow step presents to the Agent Runtime -- a
  # Percolate JWT signed with jwtSecret, not a provider key. Leave it empty
  # until there is a user to sign it for, then:
  #   percolate auth token --email you@example.com --ttl 31536000 --secret <jwtSecret>
  # The CLI's default lifetime is an hour, which is right for a person and
  # wrong for a worker.
  workerApiKey: ""

  # The object store's credentials: the bundled MinIO's root user when
  # minio.enabled, your bucket's keys otherwise. Left empty they fall back to
  # p8admin / p8password, which is fine on a laptop and a known credential
  # anywhere else -- set both (openssl rand -hex 16 / -hex 24).
  s3Key: ""
  s3Secret: ""

# ---------------------------------------------------------------------------
# The database. One instance, because this chart is the getting-started path,
# not an HA Postgres operator -- if you already run CloudNativePG or Crunchy,
# set `enabled: false` and point `externalDatabase` at it.
# ---------------------------------------------------------------------------
postgres:
  enabled: true
  image:
    repository: percolationlabs/percolate-postgres
    # Pinned, like the compose file, and for its reason: a bare "19" moves
    # under an existing install and IfNotPresent keeps whatever each node last
    # pulled. ci/versions.py holds it to versions.toml's extension.
    tag: "19-0.1.6"
    pullPolicy: IfNotPresent
  user: p8
  database: percolate
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 4Gi}
  # pg_cron is a background worker: it must be preloaded at startup, and
  # cron.database_name must name the database the jobs run in. Without this
  # every scheduled workflow, the stale-task reaper and every timer step
  # silently never fires.
  # cron.database_name is added by the template, from `database` above.
  extraArgs:
    - -c
    - shared_preload_libraries=pg_cron

externalDatabase:
  host: ""
  port: 5432
  database: percolate

# ---------------------------------------------------------------------------
# The services. All three are the same image with a different command.
# ---------------------------------------------------------------------------
image:
  repository: percolationlabs/percolate-core
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

postgrest:
  enabled: true
  image: {repository: postgrest/postgrest, tag: v12.2.8}
  replicas: 2
  schemas: "content, aiq, rbac, workflow, agentic, public"
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}

content:
  enabled: true
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

agent:
  enabled: true
  replicas: 1
  # Any OpenAI-shaped endpoint. Empty means api.openai.com.
  openaiBaseUrl: ""
  # Extra environment for the runtime: the key for any provider other than
  # OpenAI, under the name that provider's SDK reads. The model is a column
  # on agentic.agents, so which of these matters is decided by a row.
  #   env:
  #     - name: ANTHROPIC_API_KEY
  #       valueFrom: {secretKeyRef: {name: my-keys, key: anthropic}}
  env: []
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {memory: 2Gi}

# ---------------------------------------------------------------------------
# Worker pools. A LIST, not a single deployment, because `queue` is the only
# signal both claim_task and an autoscaler see: one pool per queue is how a
# slow model endpoint stops starving a fast ingestion queue.
#
# Scale by replicas here, or install KEDA and let queue depth drive it --
# `autoscaling.enabled` emits a ScaledObject whose trigger is a SQL query
# against workflow.tasks, which is the honest measure of "is there work".
# ---------------------------------------------------------------------------
workers:
  - name: http
    queue: http
    replicas: 1
    # Feeds BOTH the pod's terminationGracePeriodSeconds and KEDA's
    # cooldownPeriod, from this one key, so the two cannot drift apart. They
    # answer the same question: how long is a pod allowed to finish what it is
    # holding? Set it above your longest task.
    drainSeconds: 60
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}
    autoscaling:
      enabled: false
      minReplicas: 0        # 0 is legitimate: no queued task, no pod
      maxReplicas: 10
      # Tasks per pod. The scaler counts work that is RUNNING as well as work
      # waiting to be claimed -- see templates/workers.yaml for why counting
      # only `ready` scales pods out from under tasks in flight.
      #
      # Note what minReplicas: 0 buys and what it costs. Scaling to zero is
      # done by the KEDA operator directly, so it happens cooldownPeriod after
      # the queue empties. Set minReplicas to 1 and the drop from N to 1 goes
      # through the HPA instead, which applies its own downscale stabilization
      # window -- 300s by default, a kube-controller-manager flag no value in
      # this file can reach.
      queueDepthPerPod: 20

  # Ingestion, and it is a SEPARATE POOL for the reason stated at the top of
  # this list rather than a new one. `content.install_ingest_workflow()` puts
  # both of its steps on the `ingest` queue, and a worker polls exactly one
  # queue -- so without this pool a POST /files returns 201, registers the
  # resource, starts the run, and `parse` sits at `ready` with nothing polling
  # for it. Nothing errors, nothing retries, and the file is never read.
  #
  # Parsing is CPU and memory rather than network -- pymupdf on a large PDF is
  # the peak -- so it asks for more memory than the http pool and scales on a
  # shallower queue: an ingest task is seconds to minutes, not milliseconds.
  - name: ingest
    queue: ingest
    replicas: 1
    drainSeconds: 300
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {memory: 2Gi}
    autoscaling:
      enabled: false
      minReplicas: 0
      maxReplicas: 5
      queueDepthPerPod: 4

# ---------------------------------------------------------------------------
# Object storage. Required: an oversized step output is offloaded to it and
# refd from the task, and the Content Server keeps every uploaded byte there.
# The bundled MinIO is for getting started; point `external` at S3, R2, GCS or
# your own MinIO for anything you care about.
# ---------------------------------------------------------------------------
minio:
  enabled: true
  # Pinned to the release the compose file runs, for the database image's
  # reason: `latest` moves under an existing install.
  # MinIO's own registry: `minio/minio` on Docker Hub stopped resolving on
  # 2026-09-11. Same image, same id.
  image: {repository: quay.io/minio/minio, tag: RELEASE.2025-09-07T16-13-09Z}
  persistence: {enabled: true, size: 50Gi, storageClass: ""}

# ---------------------------------------------------------------------------
# Where each credential a worker holds may be SENT, by origin. From
# percolate-core 0.1.9 a credential with no entry goes nowhere: an upload's
# metadata could otherwise name a transcription endpoint on any host and
# receive the worker's key as a bearer token. Add a provider's origin when
# secrets.llmApiKey is meant for it. Rendered into P8_CREDENTIAL_ORIGINS on
# every worker; read by nothing before 0.1.9.
# ---------------------------------------------------------------------------
credentialOrigins:
  LLM_API_KEY: ["https://api.openai.com"]

objectStorage:
  external:
    endpoint: ""       # e.g. https://s3.eu-west-1.amazonaws.com
    region: us-east-1
  bucket: p8-content

ingress:
  enabled: false
  className: ""
  annotations: {}
  # port is required: agent 8080, content 8081, postgrest 3000
  hosts: []            # [{host: percolate.example.com, service: agent, port: 8080}]
  tls: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  # NUMERIC, and it has to be. The percolate-core image declares `USER percolate`
  # by name; with runAsNonRoot the kubelet cannot verify a non-numeric user and
  # refuses the container outright -- CreateContainerConfigError, "image has
  # non-numeric user (percolate), cannot verify user is non-root". Found by
  # deploying it. 10001 is the uid that Dockerfile creates.
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

nodeSelector: {}
tolerations: []
affinity: {}
