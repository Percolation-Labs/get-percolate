# Percolate, whole, on one machine.
#
#   docker compose up -d
#   psql postgres://p8:p8@localhost:5432/percolate -c "select workflow.compiler_capabilities()"
#
# Two images and nothing to build. The database installs itself at first start
# -- the extension bootstrap is baked into the image, so there is no init
# directory to fetch alongside this file.
#
# Every service here holds NO table grants. Each connects as a role that can
# only call SECURITY DEFINER functions, or as `authenticator`, which owns no
# privileges of its own and SET ROLEs per request so RLS sees the caller rather
# than the service.
#
# SIX SERVICES BECAUSE THERE ARE SIX ROLES, NOT BECAUSE YOU NEED SIX PROCESSES.
# This file is spelled out so that each thing the system does has somewhere
# obvious to look: the REST surface is postgrest, outbound HTTP is worker,
# reading uploaded files is ingest-worker, uploads are content, model turns are
# agent, bytes are minio. Read it as the list of roles, not as a deployment
# target.
#
# In practice one or two processes cover all of it. The three
# percolate-core services are ONE IMAGE under three commands, so a small
# deployment runs the image once per thing it actually does -- often just a
# worker, since `sql` and `p8ql` steps need no process at all -- and a large one
# splits further than this file does, a pool per queue. What must NOT be
# collapsed is the two workers: `--queue` takes one queue by design, so
# combining them means picking which of outbound calls and ingestion silently
# does not happen.
name: percolate

services:
  db:
    image: percolationlabs/percolate-postgres:19
    restart: unless-stopped
    # pg_cron is a background worker, so it must be preloaded at startup --
    # there is no CREATE EXTENSION that can add it later. cron.database_name
    # must name the database the jobs run in, and it can only be one; leaving
    # it at the default ('postgres') is the usual reason a correctly created
    # schedule never fires.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=percolate
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-p8}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-p8}
      POSTGRES_DB: percolate
      # The two service roles. Defaulted so `docker compose up` works with no
      # .env; override both for anything reachable by anyone else.
      P8_AUTHENTICATOR_PASSWORD: ${P8_AUTHENTICATOR_PASSWORD:-authpass}
      P8_WORKER_PASSWORD: ${P8_WORKER_PASSWORD:-workerpass}
    ports: ["5432:5432"]
    # MOUNTED AT /var/lib/postgresql, NOT .../data, and on 18+ that is the
    # difference between a stack that starts and one that restart-loops.
    #
    # The postgres images moved PGDATA to a major-version-specific directory
    # (/var/lib/postgresql/19/docker) so that pg_upgrade has both versions to
    # work with -- docker-library/postgres#1259. They also refuse to start when
    # they find anything at the old flat path, reporting it as an "unused
    # mount/volume", which is exactly what a volume mounted there is. This file
    # kept the pre-18 spelling, so `docker compose up` -- the one thing this
    # repo exists to make work -- failed on a completely fresh volume with
    # `Error: in 18+, these Docker images are configured to store database data
    # in a format which is compatible with "pg_ctlcluster"`.
    #
    # Mounting the parent keeps the version-aware layout rather than opting out
    # of it. The Helm chart does the other thing -- sets PGDATA to a
    # subdirectory of the mount -- for a reason that is real there and does not
    # apply here: a PVC is never empty, because of lost+found.
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-p8} -d percolate"]
      interval: 3s
      timeout: 3s
      retries: 30

  # The REST interface. Not a hand-rolled CRUD layer: every function in the
  # client API is already an RPC endpoint here, so any HTTP-capable language is
  # a full client with no generated SDK.
  postgrest:
    image: postgrest/postgrest:v12.2.8
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}}
    environment:
      PGRST_DB_URI: postgres://authenticator:${P8_AUTHENTICATOR_PASSWORD:-authpass}@db:5432/percolate
      # The FIRST schema is the default; every other is selected per request
      # with Accept-Profile.
      PGRST_DB_SCHEMAS: content, aiq, rbac, workflow, agentic, public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: ${P8_JWT_SECRET:-change-me-a-long-random-string-at-least-32-chars}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000
    ports: ["3000:3000"]

  # The only process a workflow needs, and only for steps that leave the
  # machine. p8ql and sql steps run inside Postgres with nothing running here.
  worker:
    image: percolationlabs/percolate-core:0.1.6
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}}
    command: ["worker", "--queue", "http"]
    environment:
      P8_DSN: postgres://worker:${P8_WORKER_PASSWORD:-workerpass}@db:5432/percolate
      P8_WORKER_ID: worker-1
      # Object storage, so an oversized step output is offloaded and refd
      # rather than failing the task.
      P8_S3_ENDPOINT: http://minio:9000
      P8_S3_KEY: ${MINIO_USER:-p8admin}
      P8_S3_SECRET: ${MINIO_PASSWORD:-p8password}
      P8_BUCKET: p8-content
      # Credentials named by http_call tasks are resolved from HERE, by name.
      # The database stores only the reference, so a dump of workflow.tasks
      # never contains a secret and a task stays replayable.
      LLM_API_KEY: ${LLM_API_KEY:-}

  # A SECOND worker, because a worker polls exactly one queue and ingestion
  # does not run on `http`.
  #
  # `content.install_ingest_workflow()` writes both of its steps onto the
  # `ingest` queue. Without this service a POST /files returns 201, stores the
  # bytes, registers the resource, starts the run -- and then `parse` sits at
  # `ready` forever, because nothing is polling that queue. Nothing errors and
  # nothing retries; the file is simply never read, which is the failure this
  # file existed to prevent people hitting.
  #
  # `--queue` is singular by design (one worker, one queue, so a slow queue
  # cannot starve a fast one), so the answer is another process rather than
  # another flag.
  ingest-worker:
    image: percolationlabs/percolate-core:0.1.6
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      minio: {condition: service_started}
    command: ["worker", "--queue", "ingest"]
    environment:
      P8_DSN: postgres://worker:${P8_WORKER_PASSWORD:-workerpass}@db:5432/percolate
      P8_WORKER_ID: ingest-1
      # Required here, not optional: the parse step READS the uploaded bytes
      # back out of object storage, so this worker is a client of MinIO in a
      # way the http worker is not.
      P8_S3_ENDPOINT: http://minio:9000
      P8_S3_KEY: ${MINIO_USER:-p8admin}
      P8_S3_SECRET: ${MINIO_PASSWORD:-p8password}
      P8_BUCKET: p8-content
      # The `embed` step calls the embedding endpoint named by
      # aiq.embedding_models.credential_ref, which is LLM_API_KEY by
      # convention. Parsing and chunking work without it; embedding retries and
      # then fails, so an upload is searchable by text and not by vector.
      LLM_API_KEY: ${LLM_API_KEY:-}

  content:
    image: percolationlabs/percolate-core:0.1.6
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      minio: {condition: service_started}
    command: ["content", "serve"]
    environment:
      P8_DSN: postgres://authenticator:${P8_AUTHENTICATOR_PASSWORD:-authpass}@db:5432/percolate
      P8_S3_ENDPOINT: http://minio:9000
      P8_S3_KEY: ${MINIO_USER:-p8admin}
      P8_S3_SECRET: ${MINIO_PASSWORD:-p8password}
      P8_BUCKET: p8-content
      P8_JWT_SECRET: ${P8_JWT_SECRET:-change-me-a-long-random-string-at-least-32-chars}
    ports: ["8081:8081"]

  agent:
    image: percolationlabs/percolate-core:0.1.6
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}}
    # --host is no longer passed: percolate-core#1 made `agent serve` default to
    # 0.0.0.0, matching the Content Server. It used to default to 127.0.0.1 --
    # the container's OWN loopback -- so the agent came up, logged
    # `percolate agent on http://127.0.0.1:8080`, reported healthy in
    # `docker compose ps`, and answered nothing on the published port. Left
    # unset here so this file says what the deployment needs rather than what
    # one version of one image got wrong.
    command: ["agent", "serve"]
    environment:
      # ONE NAME AGAIN, as of the 0.1.4 pin. percolate-core#1 made the agent
      # runtime read P8_DSN like every other service, so the P8_DATABASE_URL
      # line this file used to carry is gone rather than left behind: a
      # workaround kept past its reason reads as a decision, and the next person
      # to touch this file would have had to work out which it was. `core/config.py` requires
      # P8_DSN ("every service connects to Postgres") and the agent runtime's
      # own settings.py reads P8_DATABASE_URL, defaulting to
      # postgresql://p8:p8@localhost:5500/p8agentic when it is unset. With only
      # P8_DSN set, `agent serve` took that default and restart-looped on
      # `Connect call failed ('127.0.0.1', 5500)` while every other service in
      # this file connected fine -- one name for one thing, read under two, and
      # only the unset one on the path that fails.
      P8_DSN: postgres://authenticator:${P8_AUTHENTICATOR_PASSWORD:-authpass}@db:5432/percolate
      P8_JWT_SECRET: ${P8_JWT_SECRET:-change-me-a-long-random-string-at-least-32-chars}
      # THE PROVIDER'S OWN VARIABLE, not LLM_API_KEY, and one line per provider
      # because `model` is a COLUMN. The image carries every provider
      # pydantic-ai can drive, so which of these matters is decided by an
      # UPDATE to agentic.agents rather than by a rebuild -- set the one your
      # rows name and leave the rest empty.
      #
      # LLM_API_KEY is NOT among them. That is the worker's `credential_ref`
      # mechanism, resolved by name for http_call and embedding steps; this
      # runtime never reads it, so setting only that gets you a saved agent, a
      # 200 on /chat, and a RUN_ERROR about missing credentials inside the
      # stream. It is passed anyway for the delegation case, where an agent's
      # tool call is an http_call like any other.
      #
      # OPENAI_BASE_URL is the escape hatch and covers more than it looks like:
      # openrouter, cerebras, xai, zai, vLLM and Ollama are all OpenAI-shaped,
      # so they need an `openai:` model and this URL, not an SDK.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      # Each name is the one that provider's own SDK reads, checked against
      # the image rather than remembered: cohere really is CO_API_KEY and
      # huggingface really is HF_TOKEN.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      CO_API_KEY: ${CO_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      # Bedrock authenticates as AWS does, so it takes a region and the
      # standard credential chain rather than one key.
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports: ["8080:8080"]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-p8admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-p8password}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  miniodata:
