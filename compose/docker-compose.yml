# Percolate, whole, on one machine.
#
#   docker compose up -d
#   psql postgres://p8:p8@localhost:5432/percolate -c "select workflow.compiler_capabilities()"
#
# Two images and nothing to build. The database installs itself at first start
# -- the extension bootstrap is baked into the image, so there is no init
# directory to fetch alongside this file.
#
# Every service here holds NO table grants. Each connects as a role that can
# only call SECURITY DEFINER functions, or as `authenticator`, which owns no
# privileges of its own and SET ROLEs per request so RLS sees the caller rather
# than the service.
name: percolate

services:
  db:
    image: percolationlabs/percolate-postgres:19
    restart: unless-stopped
    # pg_cron is a background worker, so it must be preloaded at startup --
    # there is no CREATE EXTENSION that can add it later. cron.database_name
    # must name the database the jobs run in, and it can only be one; leaving
    # it at the default ('postgres') is the usual reason a correctly created
    # schedule never fires.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=percolate
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-p8}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-p8}
      POSTGRES_DB: percolate
      # The two service roles. Defaulted so `docker compose up` works with no
      # .env; override both for anything reachable by anyone else.
      P8_AUTHENTICATOR_PASSWORD: ${P8_AUTHENTICATOR_PASSWORD:-authpass}
      P8_WORKER_PASSWORD: ${P8_WORKER_PASSWORD:-workerpass}
    ports: ["5432:5432"]
    # MOUNTED AT /var/lib/postgresql, NOT .../data, and on 18+ that is the
    # difference between a stack that starts and one that restart-loops.
    #
    # The postgres images moved PGDATA to a major-version-specific directory
    # (/var/lib/postgresql/19/docker) so that pg_upgrade has both versions to
    # work with -- docker-library/postgres#1259. They also refuse to start when
    # they find anything at the old flat path, reporting it as an "unused
    # mount/volume", which is exactly what a volume mounted there is. This file
    # kept the pre-18 spelling, so `docker compose up` -- the one thing this
    # repo exists to make work -- failed on a completely fresh volume with
    # `Error: in 18+, these Docker images are configured to store database data
    # in a format which is compatible with "pg_ctlcluster"`.
    #
    # Mounting the parent keeps the version-aware layout rather than opting out
    # of it. The Helm chart does the other thing -- sets PGDATA to a
    # subdirectory of the mount -- for a reason that is real there and does not
    # apply here: a PVC is never empty, because of lost+found.
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-p8} -d percolate"]
      interval: 3s
      timeout: 3s
      retries: 30

  # The REST interface. Not a hand-rolled CRUD layer: every function in the
  # client API is already an RPC endpoint here, so any HTTP-capable language is
  # a full client with no generated SDK.
  postgrest:
    image: postgrest/postgrest:v12.2.8
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}}
    environment:
      PGRST_DB_URI: postgres://authenticator:${P8_AUTHENTICATOR_PASSWORD:-authpass}@db:5432/percolate
      # The FIRST schema is the default; every other is selected per request
      # with Accept-Profile.
      PGRST_DB_SCHEMAS: content, aiq, rbac, workflow, agentic, public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: ${P8_JWT_SECRET:-change-me-a-long-random-string-at-least-32-chars}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000
    ports: ["3000:3000"]

  # The only process a workflow needs, and only for steps that leave the
  # machine. p8ql and sql steps run inside Postgres with nothing running here.
  worker:
    image: percolationlabs/percolate-core:0.1.3
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}}
    command: ["worker", "--queue", "http"]
    environment:
      P8_DSN: postgres://worker:${P8_WORKER_PASSWORD:-workerpass}@db:5432/percolate
      P8_WORKER_ID: worker-1
      # Object storage, so an oversized step output is offloaded and refd
      # rather than failing the task.
      P8_S3_ENDPOINT: http://minio:9000
      P8_S3_KEY: ${MINIO_USER:-p8admin}
      P8_S3_SECRET: ${MINIO_PASSWORD:-p8password}
      P8_BUCKET: p8-content
      # Credentials named by http_call tasks are resolved from HERE, by name.
      # The database stores only the reference, so a dump of workflow.tasks
      # never contains a secret and a task stays replayable.
      LLM_API_KEY: ${LLM_API_KEY:-}

  content:
    image: percolationlabs/percolate-core:0.1.3
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      minio: {condition: service_started}
    command: ["content", "serve"]
    environment:
      P8_DSN: postgres://authenticator:${P8_AUTHENTICATOR_PASSWORD:-authpass}@db:5432/percolate
      P8_S3_ENDPOINT: http://minio:9000
      P8_S3_KEY: ${MINIO_USER:-p8admin}
      P8_S3_SECRET: ${MINIO_PASSWORD:-p8password}
      P8_BUCKET: p8-content
      P8_JWT_SECRET: ${P8_JWT_SECRET:-change-me-a-long-random-string-at-least-32-chars}
    ports: ["8081:8081"]

  agent:
    image: percolationlabs/percolate-core:0.1.3
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}}
    # --host 0.0.0.0. Also fixed at source in percolate-core#1, so this too is
    # redundant once the pin moves past 0.1.3 -- but it is harmless and
    # explicit, and an explicit bind in a compose file is not a bad thing to
    # keep. `agent serve` defaults to 127.0.0.1 and that is
    # the container's own loopback. It came up, logged
    # `percolate agent on http://127.0.0.1:8080`, and answered nothing on the
    # published port -- a service that looks healthy in `docker compose ps` and
    # is unreachable, which is worse than one that crashes. The default is right
    # for a laptop and wrong for every container; this file is the container.
    command: ["agent", "serve", "--host", "0.0.0.0"]
    environment:
      # BOTH NAMES, and this is pinned to the 0.1.3 image -- percolate-core#1
      # makes the runtime read P8_DSN, so once this file moves past 0.1.3 the
      # second line below is redundant rather than load-bearing. Kept until
      # then, and named here so it does not outlive its reason.
      #
      # This image reads two. `core/config.py` requires
      # P8_DSN ("every service connects to Postgres") and the agent runtime's
      # own settings.py reads P8_DATABASE_URL, defaulting to
      # postgresql://p8:p8@localhost:5500/p8agentic when it is unset. With only
      # P8_DSN set, `agent serve` took that default and restart-looped on
      # `Connect call failed ('127.0.0.1', 5500)` while every other service in
      # this file connected fine -- one name for one thing, read under two, and
      # only the unset one on the path that fails.
      P8_DSN: postgres://authenticator:${P8_AUTHENTICATOR_PASSWORD:-authpass}@db:5432/percolate
      P8_DATABASE_URL: postgres://authenticator:${P8_AUTHENTICATOR_PASSWORD:-authpass}@db:5432/percolate
      P8_JWT_SECRET: ${P8_JWT_SECRET:-change-me-a-long-random-string-at-least-32-chars}
      # An agent is a row; the model it uses is a column. This is only the
      # key that column's provider needs.
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports: ["8080:8080"]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-p8admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-p8password}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  miniodata:
