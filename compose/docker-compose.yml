# Percolate, whole, on one machine.
#
#   docker compose up -d
#   psql postgres://p8:p8@localhost:5432/percolate -c "select workflow.compiler_capabilities()"
#
# Two images and nothing to build. The database installs itself at first start
# -- the extension bootstrap is baked into the image, so there is no init
# directory to fetch alongside this file.
#
# Every service here holds NO table grants. Each connects as a role that can
# only call SECURITY DEFINER functions, or as `authenticator`, which owns no
# privileges of its own and SET ROLEs per request so RLS sees the caller rather
# than the service.
#
# SIX SERVICES BECAUSE THERE ARE SIX ROLES, NOT BECAUSE YOU NEED SIX PROCESSES.
# This file is spelled out so that each thing the system does has somewhere
# obvious to look: the REST surface is postgrest, outbound HTTP is worker,
# reading uploaded files is ingest-worker, uploads are content, model turns are
# agent, bytes are minio. Read it as the list of roles, not as a deployment
# target.
#
# In practice one or two processes cover all of it. The three
# percolate-core services are ONE IMAGE under three commands, so a small
# deployment runs the image once per thing it actually does -- often just a
# worker, since `sql` and `p8ql` steps need no process at all -- and a large one
# splits further than this file does, a pool per queue. What must NOT be
# collapsed is the two workers: `--queue` takes one queue by design, so
# combining them means picking which of outbound calls and ingestion silently
# does not happen.
name: percolate

services:
  db:
    image: percolationlabs/percolate-postgres:19-0.2.0
    restart: unless-stopped
    # pg_cron is a background worker, so it must be preloaded at startup --
    # there is no CREATE EXTENSION that can add it later. cron.database_name
    # must name the database the jobs run in, and it can only be one; leaving
    # it at the default ('postgres') is the usual reason a correctly created
    # schedule never fires.
    #
    # pg_stat_statements AND auto_explain are preloaded beside it, and the
    # deferral they overturn is written down rather than quietly dropped.
    # p8-subsystems meta/postgres-manifest.md:44 held pg_stat_statements back
    # until "there's something to tune, not ahead of time". What overturns it:
    #
    #   * NO STATEMENT IN THIS DEPLOYMENT IS TIMED. The signals that exist
    #     are about the workload, not about SQL: tasks stamp completed_at,
    #     v_backlog reports how long the oldest has waited, and
    #     workflow.check_hot_paths() asks whether the claim path is
    #     index-backed at depth -- a question about the PLAN's shape, not
    #     about how long anything took. So "the database got slower" has no
    #     number attached to it and a regression arrives as a support ticket.
    #     That is a fact about the tree rather than a projection, and it is
    #     the argument.
    #   * TWO CORRECT PREDICATES CAN DIFFER BY 58x AND THE PLAN SAYS NOTHING.
    #     p8-subsystems meta/postmortems/2026-09-04-resource-scoping.md:81-82:
    #     360.574 ms against 6.205 ms for the same RLS read, measured over
    #     52,000 rows in one session on a development PG19. Both predicates
    #     were right; one was hoistable. Without a timing signal the slow one
    #     ships and nobody knows for a release.
    #
    # WHAT IS DELIBERATELY NOT CITED HERE, because an earlier draft of this
    # comment did cite it: the figures in p8-subsystems
    # specs/ai-query-layer/graph-algorithms.md -- the 4,527 ms depth-3 p95 and
    # the concurrency table. That document is a research article. Its own
    # header says every figure comes from dev/scale/graph/, a heavy-tailed
    # synthetic fixture, one backend, no RLS filtering, and its status line
    # describes ten proposed algorithms against seven shipped. Those numbers
    # are evidence about a harness, not about a running system, and reading
    # them as production latency is the error #139 exists to record. A number
    # is not evidence until you know what it is a number OF.
    #
    # Both modules are contrib and already in the base image, so no new
    # dependency. pg_stat_statements needs a second half the preload does not
    # give it: the VIEW exists only in a database that ran CREATE EXTENSION,
    # and preloading without it buys the collection overhead and `relation
    # "pg_stat_statements" does not exist`. That statement is in the image's
    # superuser step (p8-subsystems dev/image-init/00-superuser.sql) as of the
    # change this file ships with -- so an image built BEFORE it, pointed at
    # this compose file, collects into a view its database has not got.
    # auto_explain needs no extension; it only writes to the log.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron,pg_stat_statements,auto_explain
      - -c
      - cron.database_name=percolate
      # 2s, and the number is the point rather than the setting. It is derived
      # from a bound this estate already declares rather than from a
      # measurement: the image gives `authenticator` -- the role every REST
      # caller arrives on -- a 30s statement_timeout, described there as
      # "longer than any interactive query should need". 2s is a fifteenth of
      # that, so a plan reaching the log is a statement well outside what the
      # deployment already calls normal, and still an order of magnitude short
      # of being killed. Lower it and the log becomes the thing nobody reads;
      # raise it and the only statements you see are the ones about to die
      # anyway.
      #
      # log_analyze=off because ANALYZE means EXECUTING the plan to instrument
      # it, on a statement already established as slow. The estimated plan
      # names the wrong node; the actual one costs a second run to confirm it.
      - -c
      - auto_explain.log_min_duration=2s
      - -c
      - auto_explain.log_analyze=off
      # BOUNDS, EXPLICIT RATHER THAN PACKAGED. Nothing in this file, the chart
      # or the image set a single limit before this: no statement_timeout, no
      # max_connections, no work_mem. A query from an agent could run until
      # somebody noticed the bill. The per-role timeouts are in the image's own
      # bootstrap; these are the ones that have to be process flags.
      # p8-subsystems meta/postgres-manifest.md §"What the database refuses"
      # argues the values.
      - -c
      - max_connections=200
      - -c
      - work_mem=8MB
      - -c
      - shared_buffers=512MB
      - -c
      - maintenance_work_mem=256MB
    # /dev/shm, AND THIS WAS MISSING FROM THE FILE USERS ACTUALLY RUN. Docker's
    # default is 64MB and maintenance_work_mem above is 256MB; pgvector sizes a
    # parallel HNSW build's shared-memory segment from the latter, so an index
    # build over a real corpus dies with
    #
    #     could not resize shared memory segment ... No space left on device
    #
    # The dev stack has carried this fix since the incident that produced it
    # (p8-subsystems dev/docker-compose.yml) and the shipped compose did not,
    # which means it was fixed for us and not for anybody who installs.
    shm_size: 1gb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-p8}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-p8}
      POSTGRES_DB: percolate
      # The two service roles. Defaulted so `docker compose up` works with no
      # .env; override both for anything reachable by anyone else.
      P8_AUTHENTICATOR_PASSWORD: ${P8_AUTHENTICATOR_PASSWORD:-authpass}
      P8_WORKER_PASSWORD: ${P8_WORKER_PASSWORD:-workerpass}
    ports: ["${P8_PG_PORT:-5432}:5432"]
    # MOUNTED AT /var/lib/postgresql, NOT .../data, and on 18+ that is the
    # difference between a stack that starts and one that restart-loops.
    #
    # The postgres images moved PGDATA to a major-version-specific directory
    # (/var/lib/postgresql/19/docker) so that pg_upgrade has both versions to
    # work with -- docker-library/postgres#1259. They also refuse to start when
    # they find anything at the old flat path, reporting it as an "unused
    # mount/volume", which is exactly what a volume mounted there is. This file
    # kept the pre-18 spelling, so `docker compose up` -- the one thing this
    # repo exists to make work -- failed on a completely fresh volume with
    # `Error: in 18+, these Docker images are configured to store database data
    # in a format which is compatible with "pg_ctlcluster"`.
    #
    # Mounting the parent keeps the version-aware layout rather than opting out
    # of it. The Helm chart does the other thing -- sets PGDATA to a
    # subdirectory of the mount -- for a reason that is real there and does not
    # apply here: a PVC is never empty, because of lost+found.
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      # Over TCP, not the socket. During the first-start install the image's
      # temporary server listens on the socket only, so a socket check passed
      # mid-install and started every service below before the extension
      # existed. The chart's readiness probe says the same (d6f79fc).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-p8} -d percolate"]
      interval: 3s
      timeout: 3s
      retries: 30

  # The REST interface. Not a hand-rolled CRUD layer: every function in the
  # client API is already an RPC endpoint here, so any HTTP-capable language is
  # a full client with no generated SDK.
  postgrest:
    image: postgrest/postgrest:v12.2.8
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}}
    environment:
      PGRST_DB_URI: postgres://authenticator:${P8_AUTHENTICATOR_PASSWORD:-authpass}@db:5432/percolate
      # The FIRST schema is the default; every other is selected per request
      # with Accept-Profile.
      PGRST_DB_SCHEMAS: content, aiq, rbac, workflow, agentic, public
      PGRST_DB_ANON_ROLE: web_anon
      # No read returns an unbounded number of rows. PostgREST will otherwise
      # stream a whole table to anybody holding select on it.
      PGRST_DB_MAX_ROWS: 10000
      PGRST_JWT_SECRET: ${P8_JWT_SECRET:-change-me-a-long-random-string-at-least-32-chars}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000
    ports: ["${P8_REST_PORT:-3000}:3000"]

  # The only process a workflow needs, and only for steps that leave the
  # machine. p8ql and sql steps run inside Postgres with nothing running here.
  worker:
    image: percolationlabs/percolate-core:0.1.10
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}}
    command: ["worker", "--queue", "http"]
    environment:
      P8_DSN: postgres://worker:${P8_WORKER_PASSWORD:-workerpass}@db:5432/percolate
      P8_WORKER_ID: worker-1
      # Object storage, so an oversized step output is offloaded and refd
      # rather than failing the task.
      P8_S3_ENDPOINT: http://minio:9000
      P8_S3_KEY: ${MINIO_USER:-p8admin}
      P8_S3_SECRET: ${MINIO_PASSWORD:-p8password}
      P8_BUCKET: p8-content
      # Credentials named by http_call tasks are resolved from HERE, by name.
      # The database stores only the reference, so a dump of workflow.tasks
      # never contains a secret and a task stays replayable.
      #
      # FALLING BACK TO OPENAI_API_KEY, because on the path these docs walk the
      # two are the same key: the sample embeds with an OpenAI model and the
      # agents answer with one. Two names for one key meant setting one of
      # them, getting a working agent, and a corpus whose every embed task
      # failed on `credential_ref 'LLM_API_KEY' is not set`. Set LLM_API_KEY
      # itself when embeddings go to a different provider.
      LLM_API_KEY: ${LLM_API_KEY:-${OPENAI_API_KEY:-}}
      # AND WHERE THAT KEY MAY GO. From percolate-core 0.1.9 a credential is
      # sent only to an origin it is bound to, and one with no binding goes
      # nowhere: an upload's metadata could otherwise name a transcription
      # endpoint on any host and receive the worker's key as a bearer token.
      # Add a provider's origin here when LLM_API_KEY is meant for it. Read by
      # nothing before 0.1.9, so it is harmless on the image pinned above.
      P8_CREDENTIAL_ORIGINS: ${P8_CREDENTIAL_ORIGINS:-{"LLM_API_KEY":["https://api.openai.com"]}}
      # WHERE AN `agent:` STEP SENDS ITS CALL. The compiler emits
      # `POST {{env.P8_AGENT_URL}}/v1/chat/completions` rather than making the
      # author write a deployment fact into a document that outlives it -- so
      # the deployment owes the value, and this file did not supply it. Every
      # agent step therefore died with `template {{env.P8_AGENT_URL}} resolved
      # to nothing`, including the one on this project's own front page. The
      # engine's plan checker already reported it (`ask | env | skipped | needs
      # P8_AGENT_URL from the worker's environment`); nothing consulted it.
      P8_AGENT_URL: ${P8_AGENT_URL:-http://agent:8080}
      # AND WHO IT CALLS AS. A signed Percolate JWT, not a provider key: the
      # worker is an ordinary authenticated client of the Agent Runtime, so it
      # needs an identity like any other. There is deliberately no default --
      # one would be a token everybody knows -- so an `agent:` step fails with
      # `credential_ref 'P8_API_KEY' is not set` until you mint one:
      #   percolate auth token --email you@example.com --orgs <your orgs>
      P8_API_KEY: ${P8_API_KEY:-}
      # ...AND WHEN IT DOES NOT USE THAT KEY AT ALL. With a signing key mounted,
      # an agent step is authenticated as the person whose run it belongs to --
      # the worker asks the database for the verified owner and mints a
      # five-minute token for them -- and P8_API_KEY above becomes the fallback
      # for the case where there is no owner rather than the identity every
      # scheduled run wears.
      #
      # Without this mount that fallback was the ONLY path: `uses_run_identity`
      # is false when the variable is unset, so every scheduled agent run in
      # this deployment acted as whatever single identity P8_API_KEY names and
      # RLS applied that person's scope to the whole night's work, whoever
      # scheduled it. (REM-96, OWASP ASI03.)
      #
      # A FILE, NOT A VALUE, and that is the whole design. A workflow can
      # resolve `{{env.X}}` inside an http_call body, so a signing key in this
      # service's environment would be a signing oracle for anybody who can
      # author a workflow -- they could mint a token for any user by asking a
      # template for it. `percolate_core/worker/agent_auth.py` reads the path.
      P8_AGENT_SIGNING_KEY_FILE: /run/percolate/agent-signing-key
    configs:
      - source: agent_signing_key
        target: /run/percolate/agent-signing-key
        mode: 0400

  # A SECOND worker, because a worker polls exactly one queue and ingestion
  # does not run on `http`.
  #
  # `content.install_ingest_workflow()` writes both of its steps onto the
  # `ingest` queue. Without this service a POST /files returns 201, stores the
  # bytes, registers the resource, starts the run -- and then `parse` sits at
  # `ready` forever, because nothing is polling that queue. Nothing errors and
  # nothing retries; the file is simply never read, which is the failure this
  # file existed to prevent people hitting.
  #
  # `--queue` is singular by design (one worker, one queue, so a slow queue
  # cannot starve a fast one), so the answer is another process rather than
  # another flag.
  ingest-worker:
    image: percolationlabs/percolate-core:0.1.10
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      minio: {condition: service_started}
    command: ["worker", "--queue", "ingest"]
    environment:
      P8_DSN: postgres://worker:${P8_WORKER_PASSWORD:-workerpass}@db:5432/percolate
      P8_WORKER_ID: ingest-1
      # Required here, not optional: the parse step READS the uploaded bytes
      # back out of object storage, so this worker is a client of MinIO in a
      # way the http worker is not.
      P8_S3_ENDPOINT: http://minio:9000
      P8_S3_KEY: ${MINIO_USER:-p8admin}
      P8_S3_SECRET: ${MINIO_PASSWORD:-p8password}
      P8_BUCKET: p8-content
      # The `embed` step calls the embedding endpoint named by
      # aiq.embedding_models.credential_ref, which is LLM_API_KEY by
      # convention. Parsing and chunking work without it; embedding retries and
      # then fails, so an upload is searchable by text and not by vector.
      # Falls back to OPENAI_API_KEY for the worker's reason above.
      LLM_API_KEY: ${LLM_API_KEY:-${OPENAI_API_KEY:-}}
      # Where the key may be sent: the worker's binding, for the worker's reason.
      P8_CREDENTIAL_ORIGINS: ${P8_CREDENTIAL_ORIGINS:-{"LLM_API_KEY":["https://api.openai.com"]}}

  content:
    image: percolationlabs/percolate-core:0.1.10
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      minio: {condition: service_started}
    command: ["content", "serve"]
    environment:
      P8_DSN: postgres://authenticator:${P8_AUTHENTICATOR_PASSWORD:-authpass}@db:5432/percolate
      P8_S3_ENDPOINT: http://minio:9000
      P8_S3_KEY: ${MINIO_USER:-p8admin}
      P8_S3_SECRET: ${MINIO_PASSWORD:-p8password}
      P8_BUCKET: p8-content
      P8_JWT_SECRET: ${P8_JWT_SECRET:-change-me-a-long-random-string-at-least-32-chars}
    ports: ["${P8_CONTENT_PORT:-8081}:8081"]

  agent:
    image: percolationlabs/percolate-core:0.1.10
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}}
    # --host is no longer passed: percolate-core#1 made `agent serve` default to
    # 0.0.0.0, matching the Content Server. It used to default to 127.0.0.1 --
    # the container's OWN loopback -- so the agent came up, logged
    # `percolate agent on http://127.0.0.1:8080`, reported healthy in
    # `docker compose ps`, and answered nothing on the published port. Left
    # unset here so this file says what the deployment needs rather than what
    # one version of one image got wrong.
    command: ["agent", "serve"]
    environment:
      # ONE NAME AGAIN, as of the 0.1.4 pin. percolate-core#1 made the agent
      # runtime read P8_DSN like every other service, so the P8_DATABASE_URL
      # line this file used to carry is gone rather than left behind: a
      # workaround kept past its reason reads as a decision, and the next person
      # to touch this file would have had to work out which it was. `core/config.py` requires
      # P8_DSN ("every service connects to Postgres") and the agent runtime's
      # own settings.py reads P8_DATABASE_URL, defaulting to
      # postgresql://p8:p8@localhost:5500/p8agentic when it is unset. With only
      # P8_DSN set, `agent serve` took that default and restart-looped on
      # `Connect call failed ('127.0.0.1', 5500)` while every other service in
      # this file connected fine -- one name for one thing, read under two, and
      # only the unset one on the path that fails.
      P8_DSN: postgres://authenticator:${P8_AUTHENTICATOR_PASSWORD:-authpass}@db:5432/percolate
      P8_JWT_SECRET: ${P8_JWT_SECRET:-change-me-a-long-random-string-at-least-32-chars}
      # THE PROVIDER'S OWN VARIABLE, not LLM_API_KEY, and one line per provider
      # because `model` is a COLUMN. The image carries every provider
      # pydantic-ai can drive, so which of these matters is decided by an
      # UPDATE to agentic.agents rather than by a rebuild -- set the one your
      # rows name and leave the rest empty.
      #
      # LLM_API_KEY is NOT among them. That is the worker's `credential_ref`
      # mechanism, resolved by name for http_call and embedding steps; this
      # runtime never reads it, so setting only that gets you a saved agent, a
      # 200 on /chat, and a RUN_ERROR about missing credentials inside the
      # stream. It is passed anyway for the delegation case, where an agent's
      # tool call is an http_call like any other.
      #
      # OPENAI_BASE_URL is the escape hatch and covers more than it looks like:
      # openrouter, cerebras, xai, zai, vLLM and Ollama are all OpenAI-shaped,
      # so they need an `openai:` model and this URL, not an SDK.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # NOT `${OPENAI_BASE_URL:-}`, which is what this line used to say. That
      # sets the variable to the EMPTY STRING, and an empty base url is not an
      # absent one: the SDK takes "" as the url and every model call fails with
      # `ModelAPIError: Connection error.` -- with a valid key and working
      # egress, inside a 200 response, as a RUN_ERROR in the SSE stream. The
      # same key worked from the host, which is the worst possible shape for a
      # bug in an escape hatch nobody using OpenAI sets.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      # Each name is the one that provider's own SDK reads, checked against
      # the image rather than remembered: cohere really is CO_API_KEY and
      # huggingface really is HF_TOKEN.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      CO_API_KEY: ${CO_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      # Bedrock authenticates as AWS does, so it takes a region and the
      # standard credential chain rather than one key.
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-${OPENAI_API_KEY:-}}
    ports: ["${P8_AGENT_PORT:-8080}:8080"]

  minio:
    # From MinIO's own registry. `minio/minio` on Docker Hub stopped resolving
    # on 2026-09-11 ("pull access denied ... repository does not exist"), which
    # broke every `docker compose up`; this is the same image, same id.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-p8admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-p8password}
    ports: ["${P8_MINIO_PORT:-9000}:9000", "${P8_MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  miniodata:

# The worker's copy of the signing key, as a file.
#
# THE SAME VALUE THE AGENT VERIFIES WITH, by construction rather than by two
# people remembering: the interpolation below is character-for-character the one
# on the agent service's `P8_JWT_SECRET`, default included. A token minted here
# and rejected there would be the confusing version of this bug -- scheduled
# runs failing with `401` and nothing saying the two halves disagree about a
# secret.
#
# `configs` RATHER THAN `secrets`, and the reason is a compose limitation worth
# stating so nobody "fixes" it. A compose secret takes its content from a host
# file or from a named environment variable; neither can carry `${VAR:-default}`,
# so a secret would make this empty whenever P8_JWT_SECRET is unset -- and an
# empty key file is a terminal error in the worker, which would turn "you did
# not set an optional variable" into "your scheduled runs stopped". A config is
# the same thing on disk in the container: a file, mode 0400, not an
# environment value. Being a file is the property that matters here, because an
# environment value is template-readable and this one must not be.
configs:
  agent_signing_key:
    content: ${P8_JWT_SECRET:-change-me-a-long-random-string-at-least-32-chars}
