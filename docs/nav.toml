# The docs, in order. One place: the site nav, the llms.txt index and the
# page-to-page footer links are all generated from this file, so a page that is
# added here cannot be missing from one of the three.
#
# There is no status field. These pages describe what is shipped and running --
# if something is not built, it does not get a page here, it gets a spec in
# p8-subsystems. A per-page status chip was the old answer and it was the wrong
# one: it let an unbuilt thing sit on the site behind a label most readers do
# not parse, and "designed" is indistinguishable from "works" to somebody
# skimming. Gaps inside an otherwise-shipped feature stay, named in place.

site_name = "Percolate"
site_tagline = "An AI workflow engine in Postgres"
site_url = "https://percolation-labs.github.io/get-percolate"
description = """
Percolate puts workflow state, agent conversations, identity and semantic \
query inside PostgreSQL. Workflows are declarative documents compiled to rows; \
steps written as SQL or P8QL execute inside the database with no process \
anywhere, and only outbound HTTP needs a worker."""

