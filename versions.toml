# THE NUMBERS THIS REPOSITORY PUBLISHES, IN ONE PLACE.
#
# Every version that appeared in prose used to be typed out where it was
# needed, and the release ended by opening an issue asking somebody to go and
# find them all. That did not work: three pages still said the dialect was
# 0.1.0 after the extension went to 0.1.1, and nothing reported it, because
# stale prose reads exactly like current prose.
#
# So the numbers live here and the pages ask for them. `docs/build.py`
# substitutes @@extension@@, @@core@@, @@chart@@ and @@core_min@@ into
# docs/src/*.md at build time; `ci/versions.py` writes the literals into the
# files that cannot hold a placeholder -- a compose file is executed, a
# Chart.yaml is parsed by Helm, a README renders on GitHub -- and then checks
# that every one of them still agrees with this file.

[published]
# What a reader can actually pull today. These move when a release publishes,
# never before: docs that name a version ahead of its artifact send people to
# a `docker pull` that 404s.
extension = "0.2.30"   # percolate + percolate_parser, and the :19-<v> image tag
core      = "0.2.10"   # percolate-core on PyPI and Docker Hub
chart     = "0.1.57"   # the Helm chart's own version, not what it deploys

[not_ours]
# THREE-PART NUMBERS IN docs/src THAT LOOK LIKE OURS AND ARE NOT.
#
# `ci/versions.py --check` refuses a literal equal to a version we publish,
# because it should have been a placeholder. It cannot tell by looking whether
# a number belongs to us, so anything in a different namespace is declared here
# with the reason, by file. A declaration is a person saying "this is not our
# number"; the checker guessing from surrounding words is how a check like this
# starts passing over numbers that ARE ours.
#
# An exemption whose literal is no longer in the file is an error, not a
# leftover -- the check runs in both directions.
#
# Keep this table small. A growing one means the docs are full of foreign
# version numbers, and the answer then is to change the samples rather than to
# keep writing exemptions.
[not_ours."skills.md"]
"0.2.0" = "the harbour-extras SAMPLE PLUGIN's own version, in the apply_plugin manifest and the sentence describing what that manifest left behind. Collides with the extension's 0.2.0 by accident; the plugin's version is the plugin author's to choose."
"0.2.1" = "the same sample plugin one bump on, inside an evidence block holding captured output from re-applying it. Replacing this with a placeholder would edit a recorded measurement."

[requires]
# The lowest version the DOCUMENTATION's own examples work against, which is a
# different fact from what is published and is allowed to be ahead of it.
#
# When this exceeds `published`, a release is outstanding and the docs describe
# something nobody can install yet -- `ci/versions.py --check` says so by name
# rather than leaving it to be discovered by a reader. `ci/coldstart.sh` is the
# other half: it runs the install guide and fails while that is true.
core      = "0.1.12"  # ci/coldstart.sh sends a scheduled run to `agent serve`,
                      # which answers /internal/run and completes the task on
                      # P8_WORKER_DSN only from percolate-core#54; 0.1.11 answers
                      # 404. agents.md registers delegation at
                      # http://agent:8080/mcp, which `agent serve` answers only
                      # from percolate-core#56, and compose's query-mcp service
                      # runs `percolate query mcp` (percolate-core#52).
                      # grammar-workflow.md describes `mode: async` holding
                      # the task for `wait_ms`, plan.md an unknown agent failing
                      # on its first attempt (a 404, not a retried 500), and
                      # agents.md the events stream refusing a caller who cannot
                      # read the session. 0.1.11 does none of these. And
                      # 0.1.11 was already the floor for `percolate sample load`
                      # against 0.2.0 (REM-147).
extension = "0.2.30"  # samples/harbour/tenants.sql creates its orgs at fixed ids and its
                      # reader with rbac.create_org / rbac.create_user, which take an id
                      # and admit the installer from 0.2.30 (REM-1082). Before that:
                      # graph.md and query.md enrol a member with rbac.add_org_member, which
                      # admits the installer session from 0.2.29 (REM-1082). Before that:
                      # samples/harbour writes agents as JSON Schema documents,
                      # and only 0.2.0 translates one into a row (REM-70)

[history]
# EVERY PUBLISHED PAIR, IN ORDER: what a fresh install pulled from that day on.
# `ci/versions.py --set` appends a row whenever it moves published.extension or
# published.core, and `--check` refuses a [published] the last row does not
# match, so the table cannot fall behind the numbers above it. docs/build.py
# renders it as @@released@@ (operating.md, "Version skew").
#
# A row says these went out together, not that nothing else works: nothing
# enforces a pairing at start-up. What does is the start-up probes, which name
# the remedy. The rows before 2026-10-23 are this file's own git history.
#
# One row per line, and this array last in the file: --set inserts before the
# closing bracket.
